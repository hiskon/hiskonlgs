/* ---------- Online çözüm ---------- */
function startTestRun(id){
  const t=getTestById(id);if(!t)return;
  if(U.testRun&&U.testRun.id!==id&&!window.confirm('Devam eden başka bir test var. İptal edilip bu test başlatılsın mı?'))return;
  if(!U.testRun||U.testRun.id!==id)U.testRun={id:id,ans:t.qs.map(()=>-1),start:Date.now()};
  saveDB(true);
  viewTestRun();
}
function viewTestRun(){
  const R=U.testRun;if(!R){go('tests');return;}
  const t=getTestById(R.id);if(!t){U.testRun=null;go('tests');return;}
  const l=lessonOfTest(R.id),s=SUBJ_BY_ID[l.subj];
  if(examTick){clearInterval(examTick);examTick=null;}
  view='testRun';viewArg=R.id;
  hideBottom();setChrome('exam');
  stage.innerHTML='';
  const head=el('div','exam-head','<button class="x-btn" id="trX" aria-label="Çık">✕</button><div class="timer" id="trTimer">00:00</div><div class="grow muted" id="trCount" style="font-size:13px;font-weight:800"></div><button class="pill" id="trFin">Bitir</button>');
  stage.appendChild(head);
  const body=el('div','exam-body page');
  body.appendChild(el('div','qhead','<span class="chip" style="--c:'+s.color+'">'+s.icon+' '+esc(l.topic)+'</span><span class="topic">Test '+t.n+'</span>'));
  t.qs.forEach((q,i)=>{
    const card=el('div','tq');card.id='tq'+i;
    card.innerHTML='<div class="tq-h"><span class="tq-n">'+(i+1)+'</span><span class="tq-d d-'+q.diff+'">'+DIFF_TR[q.diff]+'</span></div><div class="tq-s">'+stemHTML(q.stem)+'</div>';
    const list=el('div','tq-o');
    q.opts.forEach((o,k)=>{
      const b=el('button','opt ex-opt','<span class="key">'+LET[k]+'</span><span>'+fmtStem(o)+'</span>');
      b.addEventListener('click',()=>{R.ans[i]=R.ans[i]===k?-1:k;saveDB(true);updateTestRunUI();});
      list.appendChild(b);
    });
    card.appendChild(list);body.appendChild(card);
  });
  body.appendChild(el('div','sec-h','⭕ Optik Form <span style="text-transform:none;letter-spacing:0">(baloncuğa dokunarak da işaretleyebilirsin)</span>'));
  const om=el('div','card omr-live');om.id='omrLive';
  const cols=t.qs.length>10?2:1,per=Math.ceil(t.qs.length/cols);
  let html='<div class="omr-live-grid" style="grid-template-columns:repeat('+cols+',1fr)">';
  for(let c=0;c<cols;c++){
    html+='<div>';
    for(let i=c*per;i<Math.min(t.qs.length,(c+1)*per);i++){
      html+='<div class="orow"><b>'+(i+1)+'</b>'+[0,1,2,3].map(k=>'<button class="bub" data-q="'+i+'" data-k="'+k+'" aria-label="Soru '+(i+1)+' '+LET[k]+'">'+LET[k]+'</button>').join('')+'</div>';
    }
    html+='</div>';
  }
  html+='</div>';
  om.innerHTML=html;body.appendChild(om);
  om.querySelectorAll('.bub').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.q,k=+b.dataset.k;R.ans[i]=R.ans[i]===k?-1:k;saveDB(true);updateTestRunUI();}));
  const fin=el('button','btn stack','✔ Testi Bitir');fin.style.marginTop='14px';fin.addEventListener('click',()=>askFinish());
  body.appendChild(fin);
  stage.appendChild(body);
  head.querySelector('#trX').addEventListener('click',()=>{if(window.confirm('Testten çıkılsın mı? Cevapların kaydedilir, istediğin zaman kaldığın yerden devam edebilirsin.'))go('tests');});
  head.querySelector('#trFin').addEventListener('click',askFinish);
  function askFinish(){
    const blank=R.ans.filter(a=>a<0).length;
    if(window.confirm(blank?blank+' soru boş. Testi bitirmek istiyor musun?':'Testi bitirmek istiyor musun?'))finishTest();
  }
  examTick=setInterval(tickTest,1000);
  updateTestRunUI();tickTest();
}
function tickTest(){
  const R=U.testRun;if(!R||view!=='testRun')return;
  const sec=Math.max(0,Math.floor((Date.now()-R.start)/1000)),el_=$('#trTimer');
  if(el_)el_.textContent=fmtClock(sec);
}
function updateTestRunUI(){
  const R=U.testRun;if(!R||view!=='testRun')return;
  stage.querySelectorAll('.tq').forEach((card,i)=>{
    card.classList.toggle('answered',R.ans[i]>=0);
    card.querySelectorAll('.ex-opt').forEach((b,k)=>b.classList.toggle('pick',R.ans[i]===k));
  });
  stage.querySelectorAll('#omrLive .bub').forEach(b=>b.classList.toggle('on',R.ans[+b.dataset.q]===+b.dataset.k));
  const c=$('#trCount');if(c)c.textContent=R.ans.filter(a=>a>=0).length+'/'+R.ans.length+' işaretli';
}
function finishTest(){
  const R=U.testRun;if(!R)return;
  const t=getTestById(R.id);if(!t){U.testRun=null;go('tests');return;}
  if(examTick){clearInterval(examTick);examTick=null;}
  let d=0,y=0,b=0;
  t.qs.forEach((q,i)=>{
    const a=R.ans[i];
    if(a<0)b++;else if(a===q.ans){d++;recordAnswer({id:q.id},true,0);}else{y++;recordAnswer({id:q.id},false,0);}
  });
  const net=netOf(d,y),dur=Math.max(1,Math.floor((Date.now()-R.start)/1000)),ts=Date.now();
  const last={ts:ts,d:d,y:y,b:b,net:net,dur:dur,ans:ansStr(R.ans)};
  const rec=U.tests[R.id]||{attempts:0,best:null,last:null};
  rec.attempts=(rec.attempts||0)+1;rec.last=last;
  if(!rec.best||net>rec.best.net)rec.best={net:net,d:d,y:y,b:b,ts:ts};
  U.tests[R.id]=rec;
  U.stats.tests=(U.stats.tests||0)+1;
  const perfect=(d===t.qs.length);
  if(perfect)U.stats.tperfect=(U.stats.tperfect||0)+1;
  seasonEvent('test',R.id.split(':')[1]);
  ensureQuest();U.quest.correct+=d;
  dayRec(todayStr(),true).sec+=Math.min(dur,3600);
  bumpStreak();
  addXp(d*2+(perfect?25:0)+5);
  const id=R.id;U.testRun=null;
  checkAch();saveDB();
  go('testResult',id);
}

function prOMR(t,l,s,fill){
  const n=t.qs.length,cols=n>10?2:1,per=Math.ceil(n/cols);
  const ans=fill?ansArr(fill):null;
  let grid='<div class="omr-grid" style="grid-template-columns:repeat('+cols+',max-content)">';
  for(let c=0;c<cols;c++){
    grid+='<div class="omr-col">';

    }
    grid+='</div>';
  }

const RINT=[1,3,7,14],RNAME=['Kısa tekrar','Mini test','Karma tekrar','Son kontrol'];
function ensureRev(){
  U.rev=U.rev||{};
  ALL.forEach(l=>{if(U.done[l.id]&&!U.rev[l.id])U.rev[l.id]={t0:todayStr(),stage:0,u:Date.now()};});
}
function scheduleReview(lid){U.rev=U.rev||{};if(!U.rev[lid])U.rev[lid]={t0:todayStr(),stage:0,u:Date.now()};}
function revDue(lid){
  const r=U.rev[lid];if(!r||r.stage>=4)return null;
  const due=addDays(r.t0,RINT[r.stage]),eff=r.snooze&&r.snooze>due?r.snooze:due,t=todayStr();
  return {r:r,due:eff,over:Math.round((pdate(t)-pdate(eff))/86400000),ready:t>=eff};
}
function dueReviews(){
  ensureRev();
  return ALL.filter(l=>U.done[l.id]).map(l=>({l,d:revDue(l.id)})).filter(x=>x.d&&x.d.ready).sort((a,b)=>b.d.over-a.d.over);
}
function topicTestQs(lid){
  const sp=TSPEC[lid];if(!sp)return [];let o=[];
  for(let n=1;n<=sp.n;n++){const t=getTest(lid,n);if(t)t.qs.forEach(q=>o.push(getQ(q.id)));}
  return o.filter(Boolean);
}
function reviewSet(l,stage){
  const own=lessonQs(l),tq=shuffle(topicTestQs(l.id));
  const wr=ids=>shuffle(ids).sort((a,b)=>(U.wrongs[b.id]?1:0)-(U.wrongs[a.id]?1:0));
  if(stage===0)return shuffle(shuffle(own).slice(0,4).concat(tq.slice(0,2)));
  if(stage===1)return shuffle(shuffle(own).slice(0,3).concat(tq.slice(0,6))).slice(0,8);
  if(stage===2){
    const others=shuffle(ALL.filter(x=>x.subj===l.subj&&x.id!==l.id&&U.done[x.id]).reduce((a,x)=>a.concat(lessonQs(x)),[])).slice(0,4);
    return shuffle(shuffle(own).slice(0,3).concat(tq.slice(0,3)).concat(others)).slice(0,10);
  }
  const hard=tq.filter(q=>q.diff==='hard').concat(own.filter(q=>q.diff==='hard'),tq,own);
  const seen={},out=[];hard.forEach(q=>{if(!seen[q.id]&&out.length<10){seen[q.id]=1;out.push(q);}});
  return shuffle(out);
}
function startReview(l){
  const d=revDue(l.id);if(!d)return;
  const st=d.r.stage,qs=reviewSet(l,st);
  if(!qs.length){toast('ℹ️','Tekrar','Bu konu için soru bulunamadı.');return;}
  startQuiz({id:'practice',subj:l.subj,subject:l.subject,icon:l.icon,color:l.color,topic:RNAME[st]+': '+l.topic,questions:qs,review:{lid:l.id,stage:st}},'practice');
}

}

function perfScore(){
  const ov=overallStat(),cov=topicsDone(U)/ALL.length,days=lastDays(14).filter(d=>U.daily[d]&&U.daily[d].q>0).length/14;
  return Math.round((ov.pct/100*0.5+cov*0.25+days*0.25)*500);
}
function periodStat(days,off){
  const ds=lastDays(days+off).slice(0,days);let q=0,c=0;ds.forEach(d=>{const r=U.daily[d];if(r){q+=r.q;c+=r.c;}});
  return {q,c,pct:q?Math.round(c/q*100):null};
}

  const r=el('div','contract'+(claimed?' done':''),'<div class="grow"><b>'+c[1]+'</b><div class="muted" style="font-size:12px">Ödül: '+rw+'</div><div class="mini" style="height:8px;margin-top:6px"><i style="width:'+Math.round(v/c[3]*100)+'%"></i></div></div><span class="cnum">'+v+'/'+c[3]+'</span>');
  const b=el('button','pill',claimed?'✓':'Al');b.disabled=!!claimed||!ok||!seasonActive();
  b.addEventListener('click',()=>claimContract(grp,c));
  r.appendChild(b);return r;
}
/* ---------- Frame Shop ---------- */
function frameBox(id){return '<div class="ava fshop-ava '+FRAMEDEFS[id].cls+'">'+avatarHTML(U)+'</div>';}
function viewFrameShop(){
  const w=el('section','page'),act=seasonActive();
  w.innerHTML='<div class="hero" style="text-align:center"><div style="font-size:44px">🛒</div><h2 style="margin:4px 0">Frame Shop</h2><div style="font-size:30px;font-weight:900;color:#ffc800">💰 '+(U.pp||0)+' PP</div><div class="muted" style="font-size:13px">Power Points sezon sonunda silinmez. Satın alınan çerçeveler kalıcıdır.</div></div>';
  const g=el('div','fgrid');
  ['wood','anchor','gcompass','pskull','pearl','cursed','kraken','captain'].forEach(id=>{
    const d=FRAMEDEFS[id],own=!!U.cos.frames[id],can=!own&&(U.pp||0)>=d.price&&(!d.seasonOnly||act);
    const c=el('div','fcard'+(own?' own':''),frameBox(id)+'<b>'+d.name+'</b><small>'+(d.seasonOnly?'⏳ Yalnızca sezon boyunca':'')+'</small>');
    const b=el('button','pill',own?(U.frame===id?'Takılı':'Tak'):d.price+' PP');
    b.disabled=!own&&!can;
    b.addEventListener('click',()=>{
      if(own){U.frame=id;saveProfile();go('frameshop');return;}
      ppAdd(-d.price);U.cos.frames[id]=Date.now();U.frame=id;saveDB();toast(d.icon,'Satın alındı',d.name);go('frameshop');
    });
    c.appendChild(b);g.appendChild(c);
  });
  w.appendChild(g);
  w.appendChild(el('div','sec-h','⚡ Lig Boostları'));
  const bc=el('div','card');
  const lb=U.season&&U.season.lboost&&U.season.lboost.until>Date.now()?U.season.lboost:null;
  if(lb)bc.appendChild(el('div','boost-on','Aktif lig boostu: +%'+Math.round(lb.m*100)+' · '+Math.ceil((lb.until-Date.now())/60000)+' dk kaldı'));
  LBOOSTS.forEach((b,i)=>{
    const price=(i+1)*15,r=el('div','contract','<div class="grow"><b>'+b[0]+'</b><div class="muted" style="font-size:12px">+%'+Math.round(b[1]*100)+' lig puanı · '+b[2]+' dk</div></div>');
    const bt=el('button','pill',price+' PP');bt.disabled=(U.pp||0)<price||!act;
    bt.addEventListener('click',()=>{ppAdd(-price);U.season.lboost={m:b[1],until:Date.now()+b[2]*60000};saveDB();toast('⚡',b[0],'Aktif!');go('frameshop');});
    r.appendChild(bt);bc.appendChild(r);
  });
  bc.appendChild(el('div','muted','Boostlar yalnızca kazandığın XP/lig puanını artırır; seni doğrudan lig atlatmaz.'));
  w.appendChild(bc);
  stage.appendChild(w);
}

  c.appendChild(fp);

  c.appendChild(bp);

function applyBg(root){const h=root.querySelector('.hero');if(h&&U.bg&&BGDEFS[U.bg])h.classList.add('bg-'+U.bg);}
function seasonHomeCard(){
  ensureSeason();
  const tier=tierOf(),b=el('button','season-home','<div class="sh-i">🏴‍☠️</div><div class="grow"><small>SEASON 1</small><b>DEVILS OF THE CARIBBEAN</b><div class="muted" style="font-size:12.5px">Kademe '+tier+'/50 · '+(seasonActive()?seasonLeft()+' gün kaldı':'sezon bitti')+' · 💰 '+(U.pp||0)+' PP</div></div><span class="arrow">›</span>');
  b.addEventListener('click',()=>go('season'));return b;
}
/* ================= QUIZ MOTORU ================= */
let S={lesson:null,mode:'lesson',queue:[],current:null,hearts:MAX_HEARTS,energy:100,correct:0,wrong:0,total:1,locked:false,origin:null,qStart:0};

function buildKarma(){
  const qs=[];
  CORE.forEach(s=>{
    const pool=shuffle(s.lessons.reduce((a,l)=>a.concat(l.questions),[]));
    qs.push.apply(qs,pool.slice(0,2));
  });
  return {id:'karma',subj:null,subject:'Karma Deneme',icon:'🏆',color:'#ffc800',topic:'12 Soruluk Deneme',questions:shuffle(qs)};
}
function renderHearts(lostIndex){
  heartsEl.innerHTML='';
  for(let i=0;i<MAX_HEARTS;i++)heartsEl.appendChild(el('span','heart'+(i>=S.hearts?' lost':'')+(i===lostIndex?' break':''),'❤️'));
}
function renderEnergy(){
  energyFill.style.width=Math.max(0,S.energy)+'%';
  energyEl.classList.toggle('low',S.energy<=40);
}
function updateProgress(){
  const pct=Math.round((S.correct/S.total)*100),boss=S.mode==='boss';
  fillEl.style.width=(boss?100-pct:pct)+'%';
  progressEl.setAttribute('aria-valuenow',boss?100-pct:pct);
}
function startQuiz(L,mode){
  const origin=(view==='quiz'&&S.origin)?S.origin:{v:view,arg:viewArg};
  setChrome('quiz');
  view='quiz';
  stage.innerHTML='';
  const boss=mode==='boss';
  quizbar.classList.toggle('boss',boss);
  heartsEl.classList.toggle('hidden',boss);
  energyEl.classList.toggle('hidden',!boss);
  S={lesson:L,mode,queue:L.questions.map(q=>Object.assign({},q)),current:null,hearts:MAX_HEARTS,energy:100,correct:0,wrong:0,total:L.questions.length,locked:false,origin,qStart:0};
  streakNum.textContent=streakOf(U);
  renderHearts();renderEnergy();updateProgress();loadNext();
}
function startLesson(L){startQuiz(L,L.id==='karma'?'karma':'lesson');}
function startPractice(title,qs,mode){
  startQuiz({id:'practice',subj:null,subject:'Özel Tekrar',icon:'🎯',color:'#1cb0f6',topic:title,questions:qs},mode||'practice');
}
function leaveQuiz(){
  const o=S.origin;
  if(o&&o.v&&o.v!=='quiz'&&o.v!=='auth'&&o.v!=='examRun')go(o.v,o.arg);
  else go('home');
}
$('#quitBtn').addEventListener('click',()=>{
  if(window.confirm('Çıkmak istiyor musun? Bu oturumdaki ilerlemen kaybolur.'))leaveQuiz();
});

function loadNext(){
  hideBottom();
  S.locked=false;
  S.current=S.queue.shift();
  if(!S.current){completeQuiz();return;}
  S.qStart=Date.now();
  const q=S.current;
  stage.innerHTML='';
  const wrap=el('section','qwrap');
  wrap.appendChild(el('div','qhead',
    '<span class="chip" style="--c:'+q.color+'">'+q.icon+' '+q.subject+'</span><span class="topic">'+q.topic+'</span>'+
    (S.mode==='boss'?'<span class="tag" style="color:#ff9a8a">⚔️ BOSS</span>':'')+(q.retry?'<span class="retry-tag">🔁 TEKRAR</span>':'')));
  if(q.type==='mcq')renderMCQ(q,wrap);
  else if(q.type==='tf')renderTF(q,wrap);
  else if(q.type==='fill')renderFill(q,wrap);
  else renderBlocks(q,wrap);
  stage.appendChild(wrap);
  window.scrollTo({top:0});
}

function titleEl(text){const h=el('h2','qtitle');h.style.whiteSpace='pre-line';h.textContent=text;return h;}

function lockOptions(items,chosen){
  S.locked=true;
  items.forEach(it=>{
    it.b.disabled=true;
    if(it.o.ok)it.b.classList.add('correct');
    else if(it.b===chosen)it.b.classList.add('wrong');
    else it.b.classList.add('dim');
  });
}
function renderMCQ(q,wrap){
  wrap.appendChild(titleEl(q.title));
  const list=el('div'),items=[];
  shuffle(q.options).forEach((o,i)=>{
    const b=el('button','opt','<span class="key">'+'ABCD'[i]+'</span><span>'+o.t+'</span>');
    items.push({b,o});
    b.addEventListener('click',()=>{
      if(S.locked)return;
      lockOptions(items,b);
      resolve(o.ok,items.filter(x=>x.o.ok)[0].o.t);
    });
    list.appendChild(b);
  });
  wrap.appendChild(list);
}
function renderTF(q,wrap){
  wrap.appendChild(titleEl(q.title));
  wrap.appendChild(el('div','flashcard','<span class="emoji">'+q.emoji+'</span><p>'+q.statement+'</p>'));
  const row=el('div','tf-row'),items=[];
  [{t:'✅ DOĞRU',v:true},{t:'❌ YANLIŞ',v:false}].forEach(x=>{
    const b=el('button','opt',x.t),o={t:x.t,ok:x.v===q.answer};
    items.push({b,o});
    b.addEventListener('click',()=>{
      if(S.locked)return;
      lockOptions(items,b);
      resolve(o.ok,q.answer?'Doğru':'Yanlış');
    });
    row.appendChild(b);
  });
  wrap.appendChild(row);
}
function renderFill(q,wrap){
  if(q.surprise)wrap.appendChild(el('div','surprise','🎁 SÜRPRİZ SORU'));
  wrap.appendChild(titleEl(q.title));
  const blank=el('span','blank','&nbsp;');
  const p=el('p','fill-sent');
  p.appendChild(document.createTextNode(q.before+' '));
  p.appendChild(blank);
  p.appendChild(document.createTextNode(' '+q.after));
  wrap.appendChild(p);
  const chips=el('div','chips'),items=[];
  shuffle(q.options).forEach(t=>{
    const b=el('button','opt',esc(t)),o={t,ok:t===q.answer};
    items.push({b,o});
    b.addEventListener('click',()=>{
      if(S.locked)return;
      lockOptions(items,b);
      blank.textContent=t;
      blank.classList.add(o.ok?'correct':'wrong');
      resolve(o.ok,q.answer);
    });
    chips.appendChild(b);
  });
  wrap.appendChild(chips);
}
function renderBlocks(q,wrap){
  wrap.appendChild(titleEl(q.title));
  wrap.appendChild(el('div','chat','<div class="avatar">'+q.whoIcon+'</div><div class="bubble"><b>'+q.who+':</b> '+q.line+'<small>'+q.lineTr+'</small></div>'));
  wrap.appendChild(el('div','chat','<div class="avatar">'+q.meIcon+'</div><div class="bubble"><b>'+q.me+':</b> …<small>'+q.hint+'</small></div>'));
  const zone=el('div','answer-zone'),bank=el('div','bank'),check=el('button','btn hidden','Kontrol Et');
  wrap.appendChild(zone);wrap.appendChild(bank);wrap.appendChild(check);
  const all=shuffle(q.blocks.map((t,i)=>({t,i})));
  let placed=[];
  function mk(b,inZone){
    const e=el('button','block');
    e.textContent=b.t;
    e.addEventListener('click',()=>{
      if(S.locked)return;
      if(inZone)placed=placed.filter(x=>x!==b);else placed.push(b);
      draw();
    });
    return e;
  }
  function draw(){
    zone.innerHTML='';bank.innerHTML='';
    placed.forEach(b=>zone.appendChild(mk(b,true)));
    all.filter(b=>placed.indexOf(b)<0).forEach(b=>bank.appendChild(mk(b,false)));
    check.classList.toggle('hidden',placed.length===0);
  }
  check.addEventListener('click',()=>{
    if(S.locked||!placed.length)return;
    S.locked=true;
    const ok=placed.map(b=>b.t).join(' ')===q.answer;
    zone.querySelectorAll('.block').forEach(b=>{b.disabled=true;b.classList.add(ok?'correct':'wrong');});
    bank.querySelectorAll('.block').forEach(b=>{b.disabled=true;});
    check.classList.add('hidden');
    resolve(ok,q.answer);
  });
  draw();
}

/* ---- Sonuç yönetimi ---- */
const PRAISE=['Harika!','Muhteşem!','Süpersin!','Tam isabet!','Doğru!'];
function resolve(ok,answerText){
  S.locked=true;
  const q=S.current,dt=(Date.now()-S.qStart)/1000,boss=S.mode==='boss';
  ensureQuest();
  recordAnswer(q,ok,dt);
  if(!ok&&S.mode==='wrongs'&&U.wrongs[q.id])U.wrongs[q.id].rf++;
  if(ok){
    S.correct++;
    updateProgress();
    U.quest.correct++;saveDB();checkAch();
    showFeedback(true,boss?'Boss’a vurdun! ⚔️':PRAISE[Math.floor(Math.random()*PRAISE.length)],q.explain);
  }else{
    S.wrong++;
    S.queue.push(Object.assign({},q,{retry:true}));
    saveDB();
    if(boss){
      S.energy=Math.max(0,S.energy-20);renderEnergy();
      stage.classList.remove('shake-screen');void stage.offsetWidth;stage.classList.add('shake-screen');
      if(S.energy<=0){setTimeout(gameOver,1200);return;}
    }else{
      S.hearts=Math.max(0,S.hearts-1);
      renderHearts(S.hearts);
      if(S.hearts<=0){setTimeout(gameOver,1200);return;}
    }
    showFeedback(false,boss?'Boss sana vurdu! −20 enerji':'Yanlış cevap','Doğru cevap: <b>'+answerText+'</b><br>'+q.explain);
  }
}
function showFeedback(ok,title,text){
  const q=S.current;
  bottom.classList.remove('ok','bad');
  bottom.classList.add(ok?'ok':'bad');
  fbTitle.textContent=(ok?'✅ ':'❌ ')+title;
  fbText.innerHTML=text;
  const mk=$('#fbMark'),cl=$('#fbColl');
  mk.classList.toggle('on',isOn('marks',q.id));cl.classList.toggle('on',isOn('coll',q.id));
  mk.onclick=()=>{toggleMap('marks',q.id);mk.classList.toggle('on');};
  cl.onclick=()=>{toggleMap('coll',q.id);cl.classList.toggle('on');};
  btnContinue.textContent=(S.correct>=S.total)?(S.mode==='boss'?'Boss’u Bitir ⚔️':'Konuyu Bitir'):'Devam Et';
  bottom.classList.add('show');
  setTimeout(()=>btnContinue.focus({preventScroll:true}),50);
}
function hideBottom(){bottom.classList.remove('show');}
btnContinue.addEventListener('click',()=>{
  if(!S.locked)return;
  if(S.correct>=S.total)completeQuiz();else loadNext();
});

/* ---- Oyun bitti ---- */
function gameOver(){
  hideBottom();
  stage.innerHTML='';
  const boss=S.mode==='boss',b=boss?S.lesson.boss:null;
  const w=el('section','center');
  w.innerHTML=boss?
    '<div class="big">'+b.emoji+'</div><h1>'+b.name+' kazandı!</h1><p class="sub">Enerjin tükendi. Biraz daha çalış, konuları tekrar et ve yeniden dene.</p>':
    '<div class="big">💔</div><h1>Canın Bitti!</h1><p class="sub">Hatalarını temizle veya can pratiği yap.</p>';
  w.innerHTML+='<div class="stats"><div class="stat g"><b>'+S.correct+'/'+S.total+'</b><span>Doğru</span></div><div class="stat r"><b>'+S.wrong+'</b><span>Hata</span></div><div class="stat y"><b>0</b><span>'+(boss?'Enerji':'Can')+'</span></div></div>';
  if(boss){
    const b1=el('button','btn orange stack','⚔️ Yeniden Savaş');b1.addEventListener('click',()=>startBoss(b));w.appendChild(b1);
  }else{
    const b1=el('button','btn blue stack','🧹 Hatalarını Temizle');
    b1.addEventListener('click',()=>{S.hearts=MAX_HEARTS;renderHearts();loadNext();});
    const b2=el('button','btn orange stack','💪 Can Pratiği Yap');
    b2.addEventListener('click',()=>startQuiz(S.lesson,S.mode));
    w.appendChild(b1);w.appendChild(b2);
  }
  const b3=el('button','btn ghost','Geri Dön');
  b3.addEventListener('click',leaveQuiz);
  w.appendChild(b3);
  stage.appendChild(w);
}

/* ---- Tamamlama ---- */
function completeQuiz(){
  hideBottom();
  if(S.mode==='boss')completeBoss();
  else if(S.mode==='practice'||S.mode==='wrongs')completePractice();
  else completeLesson();
}
function resultHTML(title,starsHtml,sub,xp,emoji){
  return '<div class="big bounce">'+emoji+'</div><h1>'+title+'</h1>'+(starsHtml?'<div class="stars-big">'+starsHtml+'</div>':'')+
    '<p class="sub">'+sub+'</p>'+
    '<div class="stats"><div class="stat g"><b>'+S.correct+'/'+S.total+'</b><span>Doğru</span></div><div class="stat r"><b>'+S.wrong+'</b><span>Hata</span></div><div class="stat y"><b>+'+xp+'</b><span>XP</span></div></div>';
}
function finishScreen(html,primaryLabel){
  stage.innerHTML='';
  const w=el('section','center');
  w.innerHTML=html;
  const b1=el('button','btn stack',primaryLabel);b1.addEventListener('click',leaveQuiz);
  const b2=el('button','btn ghost','Ana Menü');b2.addEventListener('click',()=>go('home'));
  w.appendChild(b1);w.appendChild(b2);
  stage.appendChild(w);
  confetti();
}
function pulseStreak(){
  streakNum.textContent=streakOf(U);
  streakBox.classList.remove('bump');void streakBox.offsetWidth;streakBox.classList.add('bump');
}
function completeLesson(){
  const L=S.lesson;
  const perfect=S.wrong===0;
  const stars=perfect?3:(S.wrong<=1?2:1);
  const xp=Math.max(S.total*4,S.total*10-S.wrong*4)+20+(perfect?10:0);
  ensureQuest();
  U.stats.lessons++;U.quest.lessons++;
  if(L.id==='karma')U.stats.karma=(U.stats.karma||0)+1;
  if(perfect){U.stats.perfect++;U.quest.perfect++;}
  U.done[L.id]=Math.max(U.done[L.id]||0,stars);
  bumpStreak();
  completeTasksFor(L.id);
  scheduleReview(L.id);seasonEvent('topic',L.id);
  addXp(xp);
  checkAch();saveDB();
  pulseStreak();
  finishScreen(resultHTML('Tebrikler! Ünite Tamamlandı',starsHTML(stars),L.subject+' · '+L.topic+'<br>Günlük serin: <b style="color:var(--orange)">🔥 '+streakOf(U)+'</b>',xp,'🎆'),'Geri Dön');
}
function completePractice(){
  const xp=S.total*3+(S.wrong===0?10:0);
  bumpStreak();addXp(xp);postPractice();checkAch();saveDB();pulseStreak();
  finishScreen(resultHTML('Tekrar Tamamlandı!','',S.lesson.topic+'<br>Eksiklerini kapatmaya devam et!',xp,'🎯'),'Geri Dön');
}
function completeBoss(){
  const b=S.lesson.boss,perfect=S.wrong===0;
  if(b.kraken){krakenDone();return;}
  const xp=60+S.total*5+(perfect?40:0);
  const rec=U.bosses[b.id]||{wins:0,best:0};
  rec.wins=(rec.wins||0)+1;rec.best=Math.max(rec.best||0,S.energy);U.bosses[b.id]=rec;
  U.stats.boss=(U.stats.boss||0)+1;
  bumpStreak();addXp(xp);saveDB();
  pulseStreak();
  finishScreen(resultHTML(b.name+' yenildi!','',(perfect?'Kusursuz zafer! Hiç enerji kaybetmedin. 🏅':'Kalan enerjin: '+S.energy+'/100')+'<br>Boss rozeti ve ejderha ödülü kazandın.',xp,b.emoji),'Boss Listesine Dön');
  celebrate('🏆','Boss yenildi!',b.name,'+'+xp+' XP ve '+b.name.split(' ')[0]+' rozeti kazandın!');
  checkAch();saveDB();
}

if(DB.session&&DB.users[DB.session]&&DB.users[DB.session].google){login(DB.session);}
else{DB.session=null;go('auth');}
if(GOOGLE_ON&&location.protocol!=='file:')setupAuthListener();
})();
