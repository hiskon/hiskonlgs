<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131f24">
<title>HiskonLGS</title>
<style>
:root{
  --bg:#070d22;--card:#101a38;--card2:#17234a;--line:#25356a;--text:#e9efff;--muted:#8a9bc7;
  --green:#58cc02;--green-d:#46a302;--red:#ff4b4b;--red-d:#d33131;
  --blue:#1cb0f6;--blue-d:#1899d6;--yellow:#ffc800;--orange:#ff9600;--purple:#ce82ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-weight:700;overflow-x:hidden}
button,input{font-family:inherit}
.hidden{display:none!important}
.invisible{visibility:hidden}
#app{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}

/* ---------- ÜST BARLAR ---------- */
.topbar,.navbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(7,13,34,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.x-btn,.nav-back{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--text);font-size:17px;font-weight:900;cursor:pointer;transition:transform .1s}
.x-btn:active,.nav-back:active{transform:translateY(2px);border-bottom-width:2px}
.streak{display:flex;align-items:center;gap:4px;color:var(--orange);font-weight:900;font-size:18px;min-width:50px}
.flame{display:inline-block;transform-origin:50% 90%;animation:flame 1.4s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.2) rotate(4deg)}}
.streak.bump #streakNum{display:inline-block;animation:pop .6s}
.progress{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#58cc02,#89e219);border-radius:99px;position:relative;transition:width .7s cubic-bezier(.22,1,.36,1)}
.progress-fill::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.4)}
.hearts{display:flex;gap:1px;font-size:15px;line-height:1}
.heart{display:inline-block;transition:filter .3s}
.heart.lost{filter:grayscale(1) brightness(.55)}
.heart.break{animation:heartbreak .6s}
@keyframes heartbreak{0%{transform:scale(1)}30%{transform:scale(1.6) rotate(-12deg)}60%{transform:scale(.8) rotate(10deg)}100%{transform:scale(1)}}
.nav-title{flex:1;font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-stats{display:flex;gap:12px;font-weight:900;font-size:15px}
#navStreak{color:var(--orange)}#navXp{color:var(--yellow)}

/* ---------- SAHNE ---------- */
main{flex:1;padding:18px 16px 50px}
main.quiz{padding-bottom:210px}
.page{animation:slideIn .45s cubic-bezier(.22,1,.36,1)}
.qwrap{animation:slideIn .45s cubic-bezier(.22,1,.36,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.qhead{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:2px solid var(--c,var(--blue));color:var(--c,var(--blue));font-size:13px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}
.topic{color:var(--muted);font-size:13px}
.retry-tag{font-size:12px;color:var(--yellow);font-weight:900}
.qtitle{font-size:21px;line-height:1.4;font-weight:900;margin-bottom:20px}

/* ---------- ŞIKLAR ---------- */
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:13px 14px;font-size:16.5px;font-weight:700;line-height:1.35;cursor:pointer;margin-bottom:12px;transition:transform .1s,background .2s,border-color .2s,opacity .3s}
.opt:hover:not(:disabled){background:var(--card2);border-color:var(--blue)}
.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;margin-bottom:15px}
.opt:disabled{cursor:default;color:var(--text)}
.opt .key{flex:0 0 auto;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted)}
.opt.dim{opacity:.5}
.opt.correct{background:rgba(88,204,2,.16);border-color:var(--green);color:#c4f58f;animation:pop .45s}
.opt.correct .key{border-color:var(--green);background:var(--green);color:#10200a}
.opt.wrong{background:rgba(255,75,75,.15);border-color:var(--red);color:#ffbcbc;animation:shake .45s}
.opt.wrong .key{border-color:var(--red);background:var(--red);color:#2b0a0a}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.flashcard{background:linear-gradient(145deg,#243a45,#1b2a32);border:2px solid var(--line);border-bottom-width:6px;border-radius:22px;padding:26px 20px;text-align:center;margin-bottom:22px;animation:flip .6s cubic-bezier(.22,1,.36,1)}
@keyframes flip{from{opacity:0;transform:perspective(700px) rotateY(-70deg)}to{opacity:1;transform:none}}
.flashcard .emoji{font-size:46px;margin-bottom:10px;display:block}
.flashcard p{font-size:19px;line-height:1.55}
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf-row .opt{justify-content:center;text-align:center;font-weight:900;font-size:17px;padding:18px 10px}

.surprise{display:inline-block;margin-bottom:12px;padding:6px 14px;border-radius:99px;background:linear-gradient(90deg,#ff9600,#ffc800);color:#2b1a00;font-weight:900;font-size:13px;letter-spacing:.8px;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,200,0,.5)}50%{box-shadow:0 0 0 8px rgba(255,200,0,0)}}
.fill-sent{font-size:19px;line-height:2.1;margin-bottom:22px}
.blank{display:inline-block;min-width:110px;padding:0 10px;margin:0 4px;border-bottom:3px dashed var(--muted);text-align:center;color:var(--blue);font-weight:900;transition:all .25s}
.blank.correct{border-bottom:3px solid var(--green);color:var(--green)}
.blank.wrong{border-bottom:3px solid var(--red);color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips .opt{width:auto;margin:0 0 6px;padding:11px 18px;font-weight:900}

.chat{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.avatar{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--card2);border:2px solid var(--line)}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:6px 18px 18px 18px;padding:12px 14px;font-size:17px;line-height:1.45}
.bubble small{display:block;color:var(--muted);font-size:13px;margin-top:4px;font-weight:700}
.answer-zone{min-height:68px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0;margin:6px 0 20px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background:repeating-linear-gradient(transparent,transparent 53px,var(--line) 53px,var(--line) 55px)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:20px;min-height:52px}
.block{background:var(--card);color:var(--text);border:2px solid var(--line);border-bottom-width:5px;border-radius:13px;padding:9px 14px;font-size:17px;font-weight:800;cursor:pointer;transition:transform .1s,background .2s;animation:pop .25s}
.block:hover:not(:disabled){background:var(--card2)}
.block:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.block:disabled{cursor:default;color:var(--text)}
.block.correct{border-color:var(--green);background:rgba(88,204,2,.16);color:#c4f58f}
.block.wrong{border-color:var(--red);background:rgba(255,75,75,.15);color:#ffbcbc}

/* ---------- BUTONLAR ---------- */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-weight:900;font-size:16px;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-d);transition:transform .1s,box-shadow .1s,filter .2s;margin-bottom:5px}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.btn.blue:active{box-shadow:0 1px 0 var(--blue-d)}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 #cc7800}
.btn.orange:active{box-shadow:0 1px 0 #cc7800}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.stack{margin-bottom:14px}
.pill{border:0;border-radius:12px;padding:9px 14px;font-weight:900;font-size:13px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);white-space:nowrap}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.pill:disabled{background:var(--line);box-shadow:0 4px 0 #2a3841;color:var(--muted);cursor:default}
.pill:disabled:active{transform:none}

/* ---------- ALT BAR ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(110%);visibility:hidden;transition:transform .4s cubic-bezier(.22,1,.36,1),visibility .4s}
.bottom.show{transform:none;visibility:visible}
.bottom-in{max-width:640px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--line);border-radius:22px 22px 0 0}
.bottom.ok .bottom-in{background:#16300f;border-color:var(--green)}
.bottom.bad .bottom-in{background:#3a1717;border-color:var(--red)}
.fb-title{font-size:20px;font-weight:900;margin-bottom:6px}
.bottom.ok .fb-title{color:var(--green)}
.bottom.bad .fb-title{color:var(--red)}
.fb-text{font-size:15px;line-height:1.5;margin-bottom:14px;color:#dbe7ec;max-height:34vh;overflow:auto}
.bottom.bad .btn{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.bottom.bad .btn:active{box-shadow:0 1px 0 var(--red-d)}

/* ---------- ORTAK EKRANLAR ---------- */
.center{text-align:center;padding-top:14px;animation:slideIn .5s cubic-bezier(.22,1,.36,1)}
.big{font-size:84px;line-height:1.1;margin-bottom:14px;display:inline-block}
.float{animation:float 3s ease-in-out infinite}
.bounce{animation:bounce 1.2s ease infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-18px) scale(1.1)}}
.center h1{font-size:30px;font-weight:900;margin-bottom:10px;line-height:1.25}
.center h1 span{color:var(--green)}
.center p.sub{color:var(--muted);font-size:16px;line-height:1.55;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 26px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 6px}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat.g b{color:var(--green)}.stat.r b{color:var(--red)}.stat.y b{color:var(--yellow)}
.stars-big{font-size:40px;letter-spacing:6px;margin-bottom:14px}
.off{filter:grayscale(1) opacity(.3)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti span{position:absolute;top:-50px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}

/* ---------- GİRİŞ / KAYIT ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px;margin-bottom:18px}
.tab{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;transition:all .2s}
.tab.active{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d)}
.form{text-align:left}
.form label{display:block;color:var(--muted);font-size:13px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px}
.form input{display:block;width:100%;margin-top:6px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;color:var(--text);font-size:16px;font-weight:700;outline:none;transition:border-color .2s}
.form input:focus{border-color:var(--blue)}
.pw{position:relative}
.pw input{padding-right:48px}
.eye{position:absolute;right:8px;top:12px;width:36px;height:36px;border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--text)}
.form-err{min-height:22px;color:var(--red);font-size:14px;font-weight:800;margin-bottom:10px}
.form-err.shake{animation:shake .45s}
.note-s{color:var(--muted);font-size:13px;margin-top:16px;line-height:1.5}

/* ---------- ANA MENÜ ---------- */
.profile{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:18px}
.pavatar{flex:0 0 auto;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#58cc02,#1cb0f6);display:grid;place-items:center;font-size:34px}
.pinfo{flex:1;min-width:0}
.pinfo h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{font-size:13px;color:var(--muted);margin:2px 0 8px}
.xpbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffc800,#ff9600);border-radius:99px;transition:width .8s}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.tile{text-align:left;border:2px solid var(--line);border-bottom-width:6px;border-radius:22px;padding:18px 16px;background:var(--card);color:var(--text);cursor:pointer;min-height:158px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s,border-color .2s}
.tile:hover{border-color:var(--c)}
.tile:active{transform:translateY(4px);border-bottom-width:2px}
.tile .ti{font-size:44px}
.tile h3{font-size:18px;font-weight:900;color:var(--c);margin-top:8px}
.tile small{color:var(--muted);font-size:13px;font-weight:700}

/* ---------- DERSLER ---------- */
.lcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-bottom-width:6px;border-radius:20px;padding:14px;margin-bottom:14px;cursor:pointer;transition:transform .12s,border-color .2s}
.lcard:hover{border-color:var(--c)}
.lcard:active{transform:translateY(4px);border-bottom-width:2px;margin-bottom:18px}
.lcard.feat{background:linear-gradient(135deg,#2b2a14,#1f2c34);border-color:var(--yellow)}
.licon{flex:0 0 auto;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;border:3px solid var(--c);background:rgba(255,255,255,.04)}
.lbody{flex:1;min-width:0}
.lbody h3{font-size:17px;font-weight:900;line-height:1.3}
.lbody p{color:var(--muted);font-size:13px;margin-top:2px;font-weight:700;line-height:1.35}
.lbody .mini{margin-top:8px}
.lstars{margin-top:5px;font-size:15px;letter-spacing:2px}
.sec-title{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:10px 0 12px}
.arrow{font-size:22px;color:var(--muted)}

/* ---------- GÖREVLER ---------- */
.qcard{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.qcard.done{border-color:var(--green)}
.qi{font-size:32px}
.qb{flex:1;min-width:0}
.qb h3{font-size:16px;font-weight:900;margin-bottom:8px;line-height:1.3}
.mini{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.mini i{display:block;height:100%;background:linear-gradient(90deg,#58cc02,#89e219);border-radius:99px;transition:width .6s}
.qb small{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.hint{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:16px}

/* ---------- BAŞARIMLAR ---------- */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 12px;text-align:center}
.acard.got{border-color:var(--yellow);background:linear-gradient(160deg,#2e2a12,#1f2c34)}
.acard .ai{font-size:40px;margin-bottom:6px}
.acard:not(.got) .ai{filter:grayscale(1) opacity(.4)}
.acard h3{font-size:15px;font-weight:900;margin-bottom:4px}
.acard p{font-size:12.5px;color:var(--muted);line-height:1.4;min-height:35px;margin-bottom:8px}
.acard small{color:var(--muted);font-size:12px}

/* ---------- KONU ANLATIMLARI ---------- */
details.note{background:var(--card);border:2px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
details.note[open]{border-color:var(--c)}
details.note summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:17px;font-weight:900}
details.note summary::-webkit-details-marker{display:none}
details.note summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
details.note[open] summary::after{transform:rotate(180deg)}
details.note summary small{display:block;color:var(--muted);font-size:12.5px;font-weight:700}
.note-body{padding:0 16px 16px;line-height:1.65;font-size:15.5px;font-weight:600}
.note-body p{margin-bottom:8px}
.note-body ul{margin:6px 0 10px 4px;list-style:none}
.note-body li{margin:7px 0;padding-left:18px;position:relative}
.note-body li::before{content:"▸";position:absolute;left:0;color:var(--c)}
.example{background:rgba(28,176,246,.1);border-left:4px solid var(--blue);padding:10px 12px;border-radius:8px;margin:10px 0}
.tip{background:rgba(255,200,0,.1);border-left:4px solid var(--yellow);padding:10px 12px;border-radius:8px;margin:10px 0 14px}

/* ---------- TOAST ---------- */
.toast{position:fixed;top:12px;left:50%;z-index:80;transform:translate(-50%,-140%);width:calc(100% - 28px);max-width:420px;background:#2e2a12;border:2px solid var(--yellow);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;transition:transform .45s cubic-bezier(.22,1,.36,1);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast.show{transform:translate(-50%,0)}
.toast .ti{font-size:34px}
.toast b{display:block;font-size:12px;color:var(--yellow);letter-spacing:.8px;text-transform:uppercase}
.toast span{font-size:16px;font-weight:900}


/* ---------- GOOGLE GİRİŞ ---------- */
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#fff;color:#3c4043;border:0;border-radius:16px;padding:14px;font-weight:900;font-size:15.5px;cursor:pointer;box-shadow:0 5px 0 #c9ced3;transition:transform .1s,box-shadow .1s;margin-bottom:6px}
.gbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9ced3}
.gbtn:disabled{opacity:.7;cursor:default}
.gbtn svg{width:22px;height:22px;flex:0 0 auto}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;font-weight:800;text-transform:uppercase;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.synced{font-size:12px;color:var(--green);font-weight:800;margin-top:4px}


/* ---------- PROFİL ---------- */
.ava{display:grid;place-items:center;overflow:hidden;border-radius:50%;background:linear-gradient(135deg,#58cc02,#1cb0f6);line-height:1;flex:0 0 auto}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.nav-ava{width:36px;height:36px;font-size:20px;border:2px solid var(--line);cursor:pointer;padding:0;color:var(--text)}
.pavatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pavatar{overflow:hidden}
button.profile{width:100%;text-align:left;color:var(--text);cursor:pointer;font:inherit;border-bottom-width:6px;transition:transform .12s}
button.profile:active{transform:translateY(4px);border-bottom-width:2px}
.pf-head{text-align:center;margin-bottom:18px}
.ava.big{width:112px;height:112px;font-size:62px;margin:0 auto 10px;border:4px solid var(--line)}
.pf-mail{color:var(--muted);font-size:14px;word-break:break-all}
.pf-row{display:flex;gap:10px;align-items:center}
.pf-row input{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--text);font-size:16px;font-weight:700;outline:none}
.pf-row input:focus{border-color:var(--blue)}
.ava-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
.ava-opt{aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:var(--card);font-size:28px;cursor:pointer;display:grid;place-items:center;overflow:hidden;padding:0;color:var(--text);transition:transform .1s,border-color .2s}
.ava-opt img{width:100%;height:100%;object-fit:cover}
.ava-opt:hover{border-color:var(--blue)}
.ava-opt:active{transform:scale(.92)}
.ava-opt.sel{border-color:var(--green);box-shadow:0 0 0 3px rgba(88,204,2,.3)}
.ava-opt.up{font-size:22px;border-style:dashed}
.auth-note{background:rgba(255,200,0,.1);border-left:4px solid var(--yellow);border-radius:8px;padding:10px 12px;color:#f1deb0;font-size:14px;text-align:left;line-height:1.5;margin-bottom:16px}


/* ================= 2.0 TASARIM ================= */
body{background:radial-gradient(900px 520px at 88% -6%,rgba(255,140,40,.14),transparent 60%),radial-gradient(800px 640px at -12% 18%,rgba(70,120,255,.18),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"🐉";position:fixed;right:-40px;bottom:70px;font-size:280px;line-height:1;opacity:.035;pointer-events:none;transform:rotate(-12deg);z-index:0}
#app{position:relative;z-index:1}
main{padding-bottom:104px}
main.quiz{padding-bottom:210px}
main.exam{padding:0 0 30px}
.page>*{animation:rise .5s cubic-bezier(.22,1,.36,1) both}
.page>*:nth-child(2){animation-delay:.04s}.page>*:nth-child(3){animation-delay:.08s}.page>*:nth-child(4){animation-delay:.12s}.page>*:nth-child(5){animation-delay:.16s}.page>*:nth-child(6){animation-delay:.2s}.page>*:nth-child(7){animation-delay:.24s}.page>*:nth-child(8){animation-delay:.28s}.page>*:nth-child(n+9){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* kartlar */
.card{background:linear-gradient(165deg,#13204a,#0e1735);border:1px solid rgba(130,160,255,.16);border-radius:20px;padding:16px;box-shadow:0 10px 28px rgba(0,0,0,.35);margin-bottom:14px}
.card h3{font-size:16px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:900;background:rgba(255,255,255,.07);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px;line-height:1.5}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid rgba(130,160,255,.2);background:var(--card);color:var(--muted);padding:8px 14px;border-radius:99px;font-weight:900;font-size:13px;cursor:pointer}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
select,textarea,.fld{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit;font-size:15px;font-weight:700;outline:none}
select:focus,textarea:focus,.fld:focus{border-color:var(--blue)}
select option{background:#101a38}
textarea{min-height:84px;resize:vertical}

/* alt menü */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:640px;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(8,14,36,.96);border-top:1px solid rgba(130,160,255,.18);padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tabbar button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;cursor:pointer;font-weight:800;font-size:11px;transition:color .2s,transform .15s}
.tabbar button i{font-style:normal;font-size:22px;filter:grayscale(.7);transition:transform .25s,filter .25s}
.tabbar button.on{color:#fff}
.tabbar button.on i{filter:none;transform:translateY(-3px) scale(1.15)}
.tabbar button.on::after{content:"";width:18px;height:3px;border-radius:3px;background:linear-gradient(90deg,#ff9600,#ffc800);margin-top:1px}

/* dashboard */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1b2d6b 0%,#14214f 55%,#2a1a4a 100%);border:1px solid rgba(150,175,255,.25);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.hero::after{content:"🐉";position:absolute;right:-14px;top:-18px;font-size:120px;opacity:.12;transform:rotate(14deg)}
.hero-top{display:flex;align-items:center;gap:14px;cursor:pointer}
.hero-top .ava{width:64px;height:64px;font-size:34px}
.hero h2{font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.league-pill{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:900;background:rgba(0,0,0,.28);color:#ffe29a}
.hero-bar{margin-top:14px}
.hero-bar .lbl{display:flex;justify-content:space-between;font-size:12px;color:#b9c8f5;margin-bottom:6px;font-weight:800}
.xpbar2{height:12px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}
.xpbar2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffc800,#ff7a18);transition:width 1s cubic-bezier(.22,1,.36,1)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero-stats div{background:rgba(0,0,0,.25);border-radius:14px;padding:9px 6px;text-align:center}
.hero-stats b{display:block;font-size:18px}
.hero-stats span{font-size:11px;color:#b9c8f5;text-transform:uppercase;letter-spacing:.4px}
.today{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#rg);transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .mid b{font-size:22px}.ring .mid small{display:block;font-size:11px;color:var(--muted)}
.cta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,#2fa800,#58cc02);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 0 #2d7a00,0 14px 24px rgba(0,0,0,.3);font:inherit;transition:transform .1s,box-shadow .1s}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 #2d7a00}
.cta .ci{font-size:34px}
.cta b{display:block;font-size:17px}.cta small{opacity:.9;font-weight:700}
.sec-h{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:18px 2px 10px;font-weight:900}
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.feat{position:relative;overflow:hidden;text-align:left;border:1px solid rgba(130,160,255,.16);border-radius:20px;padding:14px;color:var(--text);cursor:pointer;background:linear-gradient(165deg,#13204a,#0e1735);min-height:104px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .2s;font:inherit}
.feat::before{content:"";position:absolute;right:-22px;top:-22px;width:80px;height:80px;border-radius:50%;background:var(--c);opacity:.18}
.feat:hover{border-color:var(--c)}
.feat:active{transform:scale(.97)}
.feat .fi{font-size:30px;position:relative}
.feat b{font-size:15px;position:relative}
.feat small{color:var(--muted);font-size:12px;font-weight:700;position:relative;line-height:1.3}
.feat .badge{position:absolute;right:10px;top:10px;min-width:22px;height:22px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 6px}
.feat.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:14px}

/* ligler / çerçeveler */
.ava{position:relative}
.fr-bronze{box-shadow:0 0 0 3px #b8743c,0 0 14px rgba(184,116,60,.55)}
.fr-silver{box-shadow:0 0 0 3px #cfd8e6,0 0 16px rgba(207,216,230,.6)}
.fr-gold{box-shadow:0 0 0 3px #ffc800,0 0 20px rgba(255,200,0,.7)}
.fr-diamond{box-shadow:0 0 0 3px #4fd8ff,0 0 22px rgba(79,216,255,.8);animation:glowfr 2.2s ease-in-out infinite}
.fr-master{box-shadow:0 0 0 3px #ff5a3c,0 0 24px rgba(255,90,60,.85);animation:glowfr 1.8s ease-in-out infinite}
.fr-grand{box-shadow:0 0 0 3px #d27bff,0 0 14px #ffc800,0 0 30px rgba(210,123,255,.9);animation:glowfr 1.4s ease-in-out infinite}
@keyframes glowfr{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.ladder{display:flex;flex-direction:column;gap:10px}
.lg{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:1px solid rgba(130,160,255,.16);background:rgba(255,255,255,.03)}
.lg.cur{border-color:var(--yellow);background:rgba(255,200,0,.08)}
.lg.lock{opacity:.5}
.lg .ava{width:46px;height:46px;font-size:24px}
.lg b{display:block}.lg small{color:var(--muted);font-weight:700;font-size:12px}

/* grafikler */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{border-radius:18px;padding:14px;border:1px solid rgba(130,160,255,.16);background:linear-gradient(165deg,#13204a,#0e1735)}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted);font-weight:800}
.kpi.g b{color:var(--green)}.kpi.b b{color:var(--blue)}.kpi.y b{color:var(--yellow)}.kpi.p b{color:var(--purple)}
.hbar{margin-bottom:12px}
.hbar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;font-weight:800}
.hbar .t span:last-child{color:var(--muted)}
.hbar .tr{height:12px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;width:0;border-radius:99px;background:var(--c,var(--green));transition:width 1s cubic-bezier(.22,1,.36,1)}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.chart .stack{width:100%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:8px 8px 4px 4px;overflow:hidden;height:0;transition:height .9s cubic-bezier(.22,1,.36,1)}
.chart .stack i{display:block;width:100%}
.chart .lab{font-size:11px;color:var(--muted);font-weight:800}
.chart .val{font-size:11px;font-weight:900;color:var(--text)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:800;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.donut{position:relative;width:130px;height:130px;flex:0 0 auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:16}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.donut .mid b{font-size:24px}.donut .mid small{display:block;font-size:11px;color:var(--muted)}
.trend{width:100%;height:120px}
.topic-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(130,160,255,.1)}
.topic-row:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.dot.g{background:var(--green)}.dot.y{background:var(--yellow)}.dot.r{background:var(--red)}.dot.n{background:var(--line)}
.pct{font-weight:900;min-width:46px;text-align:right}

/* sınav */
.exam-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(8,14,36,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(130,160,255,.16)}
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:900;color:var(--yellow)}
.timer.low{color:var(--red);animation:glow 1s infinite}
.exam-body{padding:16px}
.nav-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.nav-grid button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:900;font-size:12px;cursor:pointer;padding:0}
.nav-grid button.ans{background:rgba(28,176,246,.25);border-color:var(--blue);color:#fff}
.nav-grid button.mk{box-shadow:inset 0 0 0 2px var(--yellow)}
.nav-grid button.cur{outline:2px solid #fff}
.sub-sep{font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;grid-column:1/-1}
.opt.pick{background:rgba(28,176,246,.18);border-color:var(--blue)}
.opt.pick .key{background:var(--blue);border-color:var(--blue);color:#06233a}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row .btn{margin:0}
.btn.sm{padding:11px;font-size:14px}
.net-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;font-weight:800}
.net-row .nm{width:92px;flex:0 0 auto}
.net-row .tr{flex:1;height:14px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.net-row .tr i{display:block;height:100%;border-radius:99px}
.net-row .nv{width:84px;text-align:right;color:var(--muted);font-size:12px}
.rev{border-left:4px solid var(--red);background:rgba(255,75,75,.08);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.5}
.rev.ok{border-color:var(--green);background:rgba(88,204,2,.08)}
.rev.bl{border-color:var(--muted);background:rgba(255,255,255,.04)}

/* defter / banka */
.qitem{border:1px solid rgba(130,160,255,.16);background:linear-gradient(165deg,#13204a,#0e1735);border-radius:18px;padding:14px;margin-bottom:12px}
.qitem .qt{font-size:15px;line-height:1.5;margin:8px 0;white-space:pre-line}
.qitem .ans{font-size:13px;color:#c4f58f;margin-bottom:6px;line-height:1.45}
.qitem .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:800}
.qitem .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mini-btn{border:1px solid rgba(130,160,255,.25);background:rgba(255,255,255,.04);color:var(--text);border-radius:10px;padding:7px 11px;font-weight:800;font-size:12.5px;cursor:pointer}
.mini-btn.on{background:rgba(255,200,0,.18);border-color:var(--yellow);color:var(--yellow)}
.mini-btn.go{background:var(--green);border-color:var(--green);color:#fff}
.diff{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:900}
.diff.easy{background:rgba(88,204,2,.2);color:#9be85a}.diff.medium{background:rgba(255,200,0,.2);color:#ffd84d}.diff.hard{background:rgba(255,75,75,.2);color:#ff8f8f}
.fb-actions{display:flex;gap:8px;margin-bottom:10px}

/* boss */
.boss-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;border:1px solid rgba(255,120,80,.25);background:linear-gradient(165deg,#2a1a3f,#13183a);margin-bottom:12px}
.boss-card.lock{opacity:.55;filter:grayscale(.6)}
.boss-em{font-size:46px;width:70px;height:70px;border-radius:20px;background:rgba(0,0,0,.3);display:grid;place-items:center;flex:0 0 auto}
.boss-hero{text-align:center;padding:10px 0 4px}
.boss-hero .be{font-size:110px;line-height:1;display:inline-block;animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 12px 22px rgba(255,80,40,.45))}
.hpbar{height:16px;background:rgba(0,0,0,.4);border-radius:99px;overflow:hidden;margin:12px 0 4px;border:1px solid rgba(255,90,60,.4)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff3d3d,#ff9600);width:100%}
.topbar.boss .progress{background:rgba(0,0,0,.4)}
.topbar.boss .progress-fill{background:linear-gradient(90deg,#ff3d3d,#ff9600);float:right}
.energy{display:flex;align-items:center;gap:5px;min-width:74px}
.energy .eb{flex:1;height:12px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.energy .eb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#1cb0f6,#58cc02);transition:width .4s}
.energy.low .eb i{background:linear-gradient(90deg,#ff3d3d,#ff9600)}
.shake-screen{animation:shake .4s}

/* takvim */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{border:1px solid rgba(130,160,255,.18);border-radius:14px;padding:8px 0;background:var(--card);color:var(--text);cursor:pointer;text-align:center;font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.day small{font-size:10.5px;color:var(--muted);font-weight:800}
.day b{font-size:16px}
.day.today{border-color:var(--yellow)}
.day.sel{background:var(--blue);border-color:var(--blue)}
.day.sel small{color:#dff4ff}
.day .pips{display:flex;gap:2px;height:6px}
.day .pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.day .pips i.d{background:var(--green)}.day .pips i.a{background:var(--yellow)}
.task{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(130,160,255,.12);margin-bottom:8px}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;color:#fff;font-size:15px;cursor:pointer;flex:0 0 auto;display:grid;place-items:center;padding:0}
.chk.on{background:var(--green);border-color:var(--green)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.06)}
.heat i.l1{background:rgba(88,204,2,.3)}.heat i.l2{background:rgba(88,204,2,.55)}.heat i.l3{background:rgba(88,204,2,.85)}

/* focus */
.timer-big{position:relative;width:240px;height:240px;margin:8px auto 16px}
.timer-big svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-big circle{fill:none;stroke-width:12;stroke-linecap:round}
.timer-big .bg{stroke:rgba(255,255,255,.08)}
.timer-big .fg{stroke:#ff9600;transition:stroke-dashoffset .3s linear}
.timer-big.brk .fg{stroke:#58cc02}
.timer-big .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.timer-big .mid b{font-size:48px;font-variant-numeric:tabular-nums;display:block}
.timer-big .mid span{color:var(--muted);font-weight:800;font-size:13px}
.fpill{position:fixed;right:14px;bottom:84px;z-index:26;background:#ff9600;color:#2b1a00;font-weight:900;padding:9px 14px;border-radius:99px;box-shadow:0 8px 20px rgba(0,0,0,.4);cursor:pointer;font-variant-numeric:tabular-nums}
.fpill.brk{background:#58cc02;color:#10200a}

/* kingdom */
.region{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid rgba(130,160,255,.14);margin-bottom:10px;background:rgba(255,255,255,.03)}
.region.lock{opacity:.45}.region.cur{border-color:var(--green);background:rgba(88,204,2,.08)}
.region .ri{font-size:34px}
.build-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.build{padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(130,160,255,.14)}
.build .bi{font-size:28px}.build b{display:block;font-size:14px}.build small{color:var(--muted);font-size:11.5px;font-weight:700}
.pips2{display:flex;gap:4px;margin-top:6px}.pips2 i{width:16px;height:6px;border-radius:3px;background:var(--line)}.pips2 i.on{background:var(--yellow)}
.dragons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dr{border-radius:16px;padding:12px 6px;text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(130,160,255,.14)}
.dr .de{font-size:38px;line-height:1.1}
.dr.lock .de{filter:grayscale(1) brightness(.35)}
.dr b{display:block;font-size:12px;margin-top:4px}
.dr small{font-size:10.5px;color:var(--muted);font-weight:800}

.cel-card{position:relative;text-align:center;width:100%;max-width:360px;padding:30px 22px 22px;border-radius:28px;background:linear-gradient(165deg,#1d2e6a,#111a42);border:1px solid rgba(255,210,90,.55);box-shadow:0 0 60px rgba(255,170,40,.35);animation:popin .6s cubic-bezier(.22,1.4,.36,1)}
.cel-burst{position:absolute;inset:-60px;background:conic-gradient(from 0deg,rgba(255,200,0,.0),rgba(255,200,0,.28),rgba(255,200,0,0),rgba(255,120,40,.25),rgba(255,200,0,0),rgba(255,200,0,.28),rgba(255,200,0,0));border-radius:50%;animation:spin 8s linear infinite;pointer-events:none;mask-image:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%)}

.cel-sub{position:relative;color:#c8d4f7;margin-bottom:18px;line-height:1.5}

@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{0%{opacity:0;transform:scale(.6) translateY(30px)}100%{opacity:1;transform:none}}

.toast{background:linear-gradient(135deg,#3a2a08,#1c1a3a);overflow:hidden}
.toast::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 1.4s .3s}
@keyframes shine{to{left:130%}}
.toast .ti{animation:bounce 1s ease 2}

.badge-i.off{filter:grayscale(1) opacity(.3)}
.title-pick{display:flex;flex-wrap:wrap;gap:8px}
.exam-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;border:1px solid rgba(130,160,255,.2);background:linear-gradient(135deg,#1b2d6b,#14214f);margin-bottom:12px;cursor:pointer;color:var(--text);width:100%;text-align:left;font:inherit}
.exam-card:active{transform:scale(.98)}
.exam-card .ei{font-size:38px}
.exam-card b{display:block;font-size:17px}.exam-card small{color:#b9c8f5;font-weight:700}

<script>
(function(){
'use strict';

/* ================= İÇERİK YARDIMCILARI ================= */
const SUBJECTS=[];
function subj(id,name,icon,color,elective){const s={id,name,icon,color,elective:!!elective,lessons:[]};SUBJECTS.push(s);return s;}
function diffOf(q,sid){
  if(q.diff)return q.diff;
  if(q.type==='tf'||q.type==='fill')return 'easy';
  if(q.type==='blocks')return 'medium';
  const t=q.title||'',dg=(t.match(/\d/g)||[]).length;
  if(t.length>=130||((sid==='mat'||sid==='fen')&&dg>=4))return 'hard';
  if(t.length<75&&dg===0)return 'easy';
  return 'medium';
}
function tagQ(q,s,id,topic,i,sep){
  q.id=id+sep+i;q.lid=id;q.subjId=s.id;q.subject=s.name;q.icon=s.icon;q.color=s.color;q.topic=topic;q.emoji=q.emoji||s.icon;
}
function lesson(s,unit,id,topic,desc,notes,qs){
  qs.forEach((q,i)=>{tagQ(q,s,id,topic,i,'#');q.diff=diffOf(q,s.id);});
  s.lessons.push({id,subj:s.id,subject:s.name,icon:s.icon,color:s.color,unit,topic,desc,notes,questions:qs,extra:[]});
}
function hard(lid,qs){
  SUBJECTS.forEach(s=>s.lessons.forEach(L=>{
    if(L.id===lid){qs.forEach((q,i)=>{tagQ(q,s,lid,L.topic,i,'!');q.diff='hard';q.boss=true;});L.extra=L.extra.concat(qs);}
  }));
}
function N(intro,items,ex,tip){
  return '<p>'+intro+'</p>'+
    (items&&items.length?'<ul>'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul>':'')+
    (ex?'<div class="example"><b>Örnek:</b> '+ex+'</div>':'')+
    (tip?'<div class="tip">💡 '+tip+'</div>':'');
}
/* Çoktan seçmeli: doğru şık ilk yazılır, çalışma anında karıştırılır */
function mc(title,right,wrongs,explain){
  return {type:'mcq',title,options:[{t:right,ok:true}].concat(wrongs.map(t=>({t,ok:false}))),explain};
}
function tf(statement,answer,explain){
  return {type:'tf',title:'Bu bilgi doğru mu, yanlış mı?',statement,answer,explain};
}
function fl(title,before,after,options,answer,explain,surprise){
  return {type:'fill',title,before,after,options,answer,explain,surprise:!!surprise};
}
function bl(title,who,whoIcon,me,meIcon,line,lineTr,hint,answer,blocks,explain){
  return {type:'blocks',title,who,whoIcon,me,meIcon,line,lineTr,hint,answer,blocks,explain};
}

/* ================= TÜRKÇE ================= */
const TR=subj("tr","Türkçe","📖","#ce82ff");

lesson(TR,"Anlam Bilgisi","tr-sozcuk","Sözcükte Anlam","Gerçek, mecaz, terim, sesteş, deyim, atasözü",
N("Bir sözcük, kullanıldığı yere göre farklı anlamlar kazanabilir.",[
"<b>Gerçek anlam:</b> Sözcüğün akla gelen ilk, temel anlamıdır. <i>sert kaya</i>",
"<b>Mecaz anlam:</b> Benzetme ilgisiyle kazanılan sözcüğün asıl anlamından uzaklaşmış anlamıdır. <i>sert bir üslup</i>",
"<b>Terim anlam:</b> Bilim, sanat, meslek alanlarına özgü anlamdır. <i>üçgen, fiil</i>",
"<b>Sesteş sözcük:</b> Yazılışı ve okunuşu aynı, anlamı farklı sözcüklerdir. <i>yüz (sayı) – yüz (surat)</i>",
"<b>Deyim:</b> Çoğunlukla mecaz anlamlı, kalıplaşmış söz grubudur. <i>gözden düşmek</i>",
"<b>Atasözü:</b> Öğüt veren, genel doğruları anlatan kalıplaşmış sözdür. <i>Damlaya damlaya göl olur.</i>",
"<b>İkileme:</b> Anlamı pekiştirmek için sözcüğün tekrarlanması veya yakın anlamlı sözcüklerin yan yana gelmesidir. <i>yavaş yavaş, ağır ağır</i>"
],null,"Deyimler genellikle tam bir yargı bildirmez, atasözleri ise öğüt veren tam bir yargı bildirir."),
[
mc("Aşağıdaki cümlelerin hangisinde “tatlı” sözcüğü mecaz anlamda kullanılmıştır?",
"Tatlı bir gülümsemeyle bizi karşıladı.",
["Tatlı olarak sütlaç yedik.","Çayımı tatlı içerim.","Tatlı su balıkları göllerde yaşar."],
"Gülümseme tadılamaz; “tatlı” burada “hoş, sevimli” anlamında mecaz olarak kullanılmıştır. Diğerlerinde sözcük gerçek anlamdadır."),
mc("Aşağıdakilerden hangisi bir deyimdir?",
"Gözden düşmek",
["Damlaya damlaya göl olur.","Kitap okumak","Yavaş yavaş"],
"“Gözden düşmek”, “değerini yitirmek” anlamında kalıplaşmış bir deyimdir. İkinci seçenek atasözü, sonuncusu ikilemedir."),
tf("“Yüz” sözcüğü, hem sayıyı hem de insanın yüzünü anlatabildiği için sesteş bir sözcüktür.",true,
"Yazılışı ve okunuşu aynı olup anlamları farklı olan sözcükler sesteştir.")
]);

lesson(TR,"Anlam Bilgisi","tr-cumle","Cümlede Anlam","Öznel-nesnel yargı, sebep-sonuç, amaç-sonuç, koşul-sonuç",
N("Cümlede anlam sorularında yargının türü ve cümleler arasındaki ilişki sorulur.",[
"<b>Nesnel yargı:</b> Kanıtlanabilir, kişiye göre değişmez. <i>Ankara, Türkiye’nin başkentidir.</i>",
"<b>Öznel yargı:</b> Kişisel görüşe dayanır, kanıtlanamaz. <i>Bence en güzel mevsim ilkbahardır.</i>",
"<b>Sebep-sonuç:</b> “-dığı için, çünkü, bu yüzden”. <i>Yağmur yağdığı için maç ertelendi.</i>",
"<b>Amaç-sonuç:</b> “-mak için, diye”. <i>Kazanmak için çok çalıştı.</i>",
"<b>Koşul-sonuç:</b> “-sa/-se, eğer”. <i>Çalışırsan başarırsın.</i>",
"<b>Örtük anlam:</b> Doğrudan söylenmeyen ama cümleden çıkarılan anlamdır."
],null,"“Bence, sanırım, en güzel, kesinlikle” gibi ifadeler genellikle öznel yargıya işaret eder."),
[
mc("Aşağıdaki cümlelerin hangisi nesnel bir yargı bildirir?",
"Dünya, Güneş’in etrafında dolanır.",
["Bence en güzel mevsim ilkbahardır.","Annemin yaptığı yemekler dünyanın en lezzetlisidir.","Bu film kesinlikle çok sıkıcıydı."],
"Dünya’nın Güneş etrafında dolanması kanıtlanabilir bir bilgidir; diğerleri kişisel görüş bildirir."),
mc("Aşağıdaki cümlelerin hangisinde amaç-sonuç ilişkisi vardır?",
"Sınavı kazanmak için gece gündüz çalıştı.",
["Yağmur yağdığı için maç ertelendi.","Erken yatarsan dinç uyanırsın.","Ödevini bitirmediği için dışarı çıkamadı."],
"“Kazanmak için” ifadesi çalışmanın amacını bildirir. Diğerleri sebep-sonuç veya koşul-sonuç ilişkisi taşır."),
fl("Boşluğu doğru terimle tamamla.","“Düzenli çalışırsan başarılı olursun.” cümlesinde","ilişkisi vardır.",
["koşul-sonuç","amaç-sonuç","sebep-sonuç","karşılaştırma"],"koşul-sonuç",
"“-sa/-se” eki ile kurulan, bir şarta bağlı sonuç bildiren cümleler koşul-sonuç cümleleridir.")
]);

lesson(TR,"Anlam Bilgisi","tr-parca","Parçada Anlam","Ana fikir, anlatım biçimleri, düşünceyi geliştirme",
N("Parçada anlam, bir metnin bütününden çıkarılan yargıları ve metnin kuruluşunu inceler.",[
"<b>Konu:</b> Parçada üzerinde durulan şeydir. <b>Ana fikir:</b> Yazarın okuyucuya vermek istediği temel mesajdır.",
"<b>Yardımcı fikirler:</b> Ana fikri destekleyen yan düşüncelerdir.",
"<b>Paragraf yapısı:</b> giriş – gelişme – sonuç.",
"<b>Anlatım biçimleri:</b> açıklayıcı (bilgi verir), tartışmacı (savunur/karşı çıkar), betimleyici (gözümüzde canlandırır), öyküleyici (olay anlatır).",
"<b>Düşünceyi geliştirme yolları:</b> tanımlama, örneklendirme, karşılaştırma, tanık gösterme, sayısal verilerden yararlanma, benzetme."
],null,"Ana fikri bulmak için “Yazar bana ne söylemek istiyor?” sorusunu sor."),
[
mc("Okuyucunun gözünde bir varlığı veya yeri canlandırmayı amaçlayan anlatım biçimi hangisidir?",
"Betimleme",
["Öyküleme","Açıklama","Tartışma"],
"Betimleme (tasvir), varlıkların özelliklerini ayrıntılı anlatarak gözümüzde canlandırır."),
mc("“Kütüphane, kitapların düzenli biçimde saklandığı ve okunduğu yerdir.” cümlesinde hangi düşünceyi geliştirme yolu kullanılmıştır?",
"Tanımlama",
["Örneklendirme","Karşılaştırma","Tanık gösterme"],
"Bir kavramın ne olduğu açıklandığı için tanımlama yoluna başvurulmuştur."),
tf("Bir parçanın ana fikri, sadece ilk cümleden çıkarılabilir.",false,
"Ana fikir, parçanın bütününden çıkarılır. İlk cümle bazen konuyu verir ama ana fikri tek başına belirlemez.")
]);

lesson(TR,"Dil Bilgisi","tr-fiilimsi","Fiilimsiler","İsim-fiil, sıfat-fiil, zarf-fiil",
N("Fiilimsi, fiil kök veya gövdesinden türeyen; ancak fiil gibi çekimlenmeyip cümlede <b>isim, sıfat veya zarf</b> görevi üstlenen sözcüktür.",[
"<b>İsim-fiil:</b> -ma/-me, -mak/-mek, -ış/-iş ekleriyle yapılır. <i>Yüzmek sağlıklıdır.</i>",
"<b>Sıfat-fiil:</b> -an/-en, -dık/-dik, -acak/-ecek, -mış, -mez ekleriyle yapılır, bir adı niteler. <i>Yağan yağmur</i>",
"<b>Zarf-fiil:</b> -arak/-erek, -ıp/-ip, -ınca/-ince, -ken, -madan, -dıkça ekleriyle yapılır, fiili niteler. <i>Koşarak geldi.</i>"
],null,"Sözcüğün neyi nitelediğine bak: bir <b>ada</b> bağlıysa sıfat-fiil, bir <b>fiile</b> bağlıysa zarf-fiildir."),
[
mc("Aşağıdaki cümlelerin hangisinde sıfat-fiil (ortaç) kullanılmıştır?",
"Yağan yağmur bahçeyi ıslattı.",
["Koşarak okula yetişti.","Kitap okumak en büyük zevkimdir.","Eve gelince seni arayacağım."],
"“Yağan”, yağ- fiiline -an eki gelerek “yağmur” adını niteler; sıfat-fiildir."),
mc("Aşağıdaki cümlelerin hangisinde isim-fiil vardır?",
"Yüzmek sağlık için çok faydalıdır.",
["Gelen misafirleri kapıda karşıladık.","Eve varınca bize haber verdi.","Gülerek odaya girdi."],
"“Yüzmek”, -mek ekiyle yapılmış ve cümlede isim görevinde kullanılmıştır."),
fl("Boşluğu doğru terimle tamamla.","“Gülerek odaya girdi.” cümlesindeki “gülerek” sözcüğü bir","türündedir.",
["zarf-fiil","sıfat-fiil","isim-fiil","edat"],"zarf-fiil",
"“Gülerek”, girdi fiilini nasıl sorusuyla niteler; -erek ekli zarf-fiildir.")
]);

lesson(TR,"Dil Bilgisi","tr-oge","Cümlenin Ögeleri","Yüklem, özne, nesne, dolaylı tümleç, zarf tümleci",
N("Cümleyi oluşturan görevli sözcüklere öge denir.",[
"<b>Yüklem:</b> Cümlede iş, oluş, durum bildirir; genellikle sondadır.",
"<b>Özne:</b> Yüklemi yapan varlıktır. “Kim? Ne?” sorusunun cevabıdır.",
"<b>Nesne:</b> İşten etkilenen varlıktır. “Neyi? Kimi?” (belirtili nesne -ı/-i ekli).",
"<b>Dolaylı tümleç (yer tamlayıcısı):</b> -e, -de, -den ekleriyle “kime, nereye, nerede, nereden” sorularına cevap verir.",
"<b>Zarf tümleci:</b> Yüklemin zamanını, durumunu, miktarını bildirir: “nasıl, ne zaman, ne kadar”.",
"<b>Cümle vurgusu:</b> Vurgulanmak istenen öge, yüklemden hemen önce getirilir."
],"Ali, kitabı <b>masaya</b> bıraktı. → masaya: dolaylı tümleç; kitabı: nesne."),
[
mc("“Ali, kitabı masaya bıraktı.” cümlesinde dolaylı tümleç hangisidir?",
"masaya",
["kitabı","Ali","bıraktı"],
"“Nereye bıraktı?” sorusunun cevabı “masaya”dır; -e ekli dolaylı tümleçtir. “Kitabı” nesnedir."),
mc("“Çocuklar bahçede neşeyle oynadı.” cümlesinde “neşeyle” sözcüğü hangi ögedir?",
"Zarf tümleci",
["Nesne","Özne","Yüklem"],
"“Nasıl oynadı?” sorusuna cevap verir; yüklemin durumunu bildirdiği için zarf tümlecidir."),
tf("Cümlede vurgulanmak istenen öge genellikle yüklemden hemen önce yer alır.",true,
"Türkçede vurgulanan öge yükleme yakın konumlanır.")
]);

lesson(TR,"Dil Bilgisi","tr-cati","Fiilde Çatı","Etken-edilgen, geçişli-geçişsiz",
N("Çatı, fiilin özneyle ve nesneyle ilişkisine göre türünü gösterir.",[
"<b>Etken fiil:</b> Öznesi işi yapandır. <i>Ali kapıyı kapattı.</i>",
"<b>Edilgen fiil:</b> Öznesi işi yapan değil, işten etkilenendir; -ıl/-il/-ın/-in eki alır. <i>Kapı kapatıldı.</i>",
"<b>Geçişli fiil:</b> Nesne alır (“neyi, kimi?”). <i>Kitabı okudu.</i>",
"<b>Geçişsiz fiil:</b> Nesne almaz. <i>Çocuk uyudu.</i>"
],null,"Edilgen fiilin öznesi işi yapan değildir; “kim tarafından?” sorusuyla gerçek yapıcı bulunabilir."),
[
mc("Aşağıdaki cümlelerin hangisinde edilgen çatılı fiil vardır?",
"Ödevler zamanında teslim edildi.",
["Öğretmen ödevi kontrol etti.","Ödevleri zamanında teslim etti.","Kapıyı yavaşça açtı."],
"“Edildi”, -il eki alan edilgen fiildir; özne (ödevler) işi yapan değildir."),
mc("Aşağıdaki cümlelerin hangisinde geçişsiz fiil kullanılmıştır?",
"Çocuk erkenden uyudu.",
["Çocuk sütünü içti.","Ahmet kapıyı kapattı.","Annem yemeği hazırladı."],
"“Uyudu” fiili “neyi?” sorusuna cevap almaz; geçişsizdir."),
tf("Edilgen çatılı fiillerde özne, işi yapan değil işten etkilenen varlıktır.",true,
"Edilgen fiillerde özne işi yapmaz, işten etkilenir.")
]);

lesson(TR,"Dil Bilgisi","tr-cumleturu","Cümle Türleri","Anlam, yüklem, yer ve yapıya göre cümleler",
N("Cümleler farklı ölçütlere göre sınıflandırılır.",[
"<b>Anlamına göre:</b> olumlu, olumsuz, soru, ünlem.",
"<b>Yüklemin türüne göre:</b> <i>isim cümlesi</i> (yüklem isim veya ek-fiille kurulur), <i>fiil cümlesi</i> (yüklem fiildir).",
"<b>Yüklemin yerine göre:</b> <i>kurallı</i> (yüklem sonda), <i>devrik</i> (yüklem sonda değil).",
"<b>Yapısına göre:</b> tek yüklemli (basit), fiilimsili, birden çok yüklemli (sıralı/bağlı), bağlaçlı cümleler."

[

"Yüklem (geldi) cümlenin başında olduğu için cümle devriktir."),
mc("Aşağıdaki cümlelerin hangisi isim cümlesidir?",

["Bu akşam eve erken geldim.","Çocuklar parkta koşuyor.","Kitabı masaya bıraktı."],

lesson(TR,"Dil Bilgisi","tr-anlatim","Anlatım Bozuklukları","Anlama ve yapıya dayalı bozukluklar",
N("Anlatım bozukluğu, cümlenin anlam veya dil bilgisi yönünden hatalı olmasıdır.",[
"<b>Anlama dayalı:</b> gereksiz sözcük kullanımı (<i>geri dönmek</i>), anlamca çelişen sözcükler, mantık hatası, yanlış anlamda sözcük kullanımı.",
"<b>Yapıya dayalı:</b> özne-yüklem uyumsuzluğu, çatı uyuşmazlığı, ek ve bağlaç eksikliği veya fazlalığı, tamlama hataları."
],"“Ben ve arkadaşım okula gittim.” → özne-yüklem uyumsuzluğu (doğrusu: gittik).","Cümleyi önce yüklemden başlayarak oku; özne ve yüklem uyuyor mu, anlam tutarlı mı diye kontrol et."),
[

"Yaşlı adam, mutluluktan ağlayıp çok üzülüyordu.",
["Sınavdan önce konuları tekrar ettim.","Misafirler akşam yemeğinde geldi.","Bu yaz tatilde deniz kenarına gideceğiz."],
"Aynı kişi için “mutluluk” ve “üzülmek” birbiriyle çelişir; anlamca tutarsız bir cümledir."),
tf("“Hepimiz birlikte toplu halde yürüdük.” cümlesinde gereksiz sözcük kullanımı vardır.",true,

mc("Aşağıdaki cümlelerin hangisinde özne-yüklem uyumsuzluğu vardır?",
"Ben ve arkadaşım okula gittim.",
["Ben ve arkadaşım okula gittik.","Annem pazardan elma aldı.","Kardeşim yarın dedemlere gidecek."],
"“Ben ve arkadaşım” birden çok kişiyi ifade eder; yüklem “gittik” olmalıdır.")

lesson(TR,"Yazım ve Noktalama","tr-yazim","Yazım Kuralları","De/da, ki, mi, sayılar, birleşik sözcükler",
N("Türkçede yazım kuralları anlamı ve doğru yazımı korur.",[
"<b>Büyük harf:</b> Cümle başı ve özel adlar büyük harfle başlar.",
"<b>“de/da”:</b> Bağlaç olan <i>de/da</i> ayrı yazılır (<i>Ben de geldim.</i>); bulunma eki bitişik yazılır (<i>evde</i>).",
"<b>“ki”:</b> Bağlaç olan <i>ki</i> ayrı yazılır (<i>Duydum ki yarın tatilmiş.</i>); ilgi/sıfat yapan <i>-ki</i> bitişik yazılır (<i>evdeki</i>).",
"<b>“mi”:</b> Soru eki ayrı yazılır (<i>Geldi mi?</i>).",
"<b>Sayılar:</b> Sözcükle yazılırken ayrı yazılır (<i>yirmi beş</i>).",
"<b>Birleşik sözcükler:</b> Bazı sözcükler bitişik yazılır (<i>birkaç, hiçbir, herkes, kırkayak</i>)."
],null,"“De” bağlacı cümleden çıkarılınca anlam bozulmuyorsa ayrı yazılır."),
[
mc("Aşağıdaki cümlelerin hangisinde yazım yanlışı vardır?",
"Duydumki yarın tatilmiş.",
["Ben de seninle geleceğim.","Evdeki yemek soğudu.","Geldi mi?"],
"Bağlaç olan “ki” ayrı yazılır: “Duydum ki yarın tatilmiş.”"),
mc("Aşağıdakilerden hangisi doğru yazılmıştır?",
"kırkayak",
["bir kaç","her kes","hiç bir"],
"Doğru yazımlar: birkaç, herkes, hiçbir. “Kırkayak” bitişik yazılan bir sözcüktür."),
tf("Soru eki “mi”, kendisinden önceki sözcükten ayrı yazılır.",true,
"Soru eki “mi” her zaman ayrı yazılır: “Geldi mi?”")
]);

lesson(TR,"Yazım ve Noktalama","tr-noktalama","Noktalama İşaretleri","Nokta, virgül, iki nokta, kesme, soru ve ünlem",
N("Noktalama işaretleri anlamı netleştirir.",[
"<b>Nokta (.):</b> Cümle sonu, kısaltmalar, sıra sayıları.",
"<b>Virgül (,):</b> Sıralı sözcükler, hitap, ara söz ve eş görevli sözler arasında.",
"<b>İki nokta (:):</b> Açıklama veya örnek verilecek cümlenin sonunda.",
"<b>Noktalı virgül (;):</b> Birbirine yakın anlamlı bağımsız cümleler veya öbekler arasında.",
"<b>Soru işareti (?):</b> Soru bildiren cümle sonunda.",
"<b>Ünlem (!):</b> Sevinç, şaşkınlık, seslenme bildiren ifadelerde.",
"<b>Kesme işareti (’):</b> Özel adlara gelen ekleri ayırır (<i>Ankara’ya</i>). Ortak adlara gelmez."
],null,"Soru anlamı taşımayan bir cümlede (“Ne yapacağımı bilmiyorum.”) soru sözcüğü olsa bile soru işareti konmaz."),
[
mc("Aşağıdaki cümlelerin hangisinde kesme işareti yanlış kullanılmıştır?",
"Çocuklar’ın sesi bahçeden duyuluyordu.",
["Ankara’ya yarın gideceğiz.","Atatürk’ün sözleri hâlâ güncel.","Ayşe’nin kitabını getirdim."],
"“Çocuklar” ortak ad olduğu için ek kesme işaretiyle ayrılmaz: “Çocukların”."),
mc("Aşağıdakilerden hangisinde iki nokta (:) doğru kullanılmıştır?",
"Sepete şunları koydum: elma, armut, muz.",
["Ben: okula gittim.","Hava: çok soğuktu bugün.","Dün: parka gittik."],
"İki nokta, kendisinden sonra açıklama veya örnek gelecek cümlenin sonunda kullanılır."),
tf("İçinde soru sözcüğü bulunsa bile soru anlamı taşımayan cümlenin sonuna soru işareti konmaz.",true,
"“Ne yapacağını bilmiyorum.” cümlesi soru değil, bilgi bildirir.")
]);

lesson(TR,"Görsel Okuma ve Mantık","tr-mantik","Sözel Mantık ve Muhakeme","Sıralama, şifreleme, tablolama",

lesson(TR,"Görsel Okuma ve Mantık","tr-gorsel","Görsel Okuma ve Grafik Yorumlama","Karikatür, infografik, tablo ve grafik",
N("Görsel okuma, metin dışındaki görsellerden anlam çıkarmayı gerektirir.",[
"<b>Karikatür:</b> Bir durumu abartılı çizimle eleştiren, mizah içeren görsel.",

[

mc("Bir grafiği yorumlarken ilk olarak nelere bakılmalıdır?",
"Grafiğin başlığına, eksenlerine ve birimlerine",
["Kullanılan renklerin sayısına","Grafiğin hangi yazı tipiyle hazırlandığına","Grafiğin ne kadar yer kapladığına"],

tf("Verileri kısa metinler ve görsellerle özetleyen çalışmaya infografik denir.",true,
"İnfografik, bilgiyi görsel ve kısa metinle sunar.")

lesson(TR,"Görsel Okuma ve Mantık","tr-tur","Metin Türleri ve Söz Sanatları","Roman, hikâye, deneme, anı, biyografi; benzetme, kişileştirme, abartma",
N("Metin türleri yazarın amacına ve anlatış biçimine göre ayrılır.",[
"<b>Roman:</b> Uzun, kurmaca anlatı. <b>Hikâye:</b> Kısa, tek olayı anlatan kurmaca metin.",

"<b>Anı:</b> Yaşanmış olayların anlatıldığı yazı. <b>Biyografi:</b> Bir kişinin yaşamının başkası tarafından anlatılması; <b>otobiyografi:</b> kişinin kendi yaşamını anlatması.",

"<b>Abartma:</b> Bir durumu olduğundan çok büyük veya küçük göstermek.",

]),
[
mc("“Güneş, dağların ardından gülümseyerek doğdu.” cümlesinde hangi söz sanatı vardır?",

["Abartma","Benzetme","Tezat"],
"Güneşe “gülümseme” gibi insana özgü bir özellik verilmiştir."),
mc("Aşağıdaki cümlelerin hangisinde abartma sanatı vardır?",
"Dünyanın en yüksek dağını bir hamlede aşarım.",
["Gözleri deniz gibi maviydi.","Hava çok sıcaktı.","Okul bahçesinde çocuklar oynuyordu."],
"Gerçekte imkânsız olacak kadar büyütülmüş bir ifade (abartma) vardır."),
mc("Bir kişinin kendi yaşamını kendisinin anlattığı edebî tür hangisidir?",
"Otobiyografi",
["Biyografi","Makale","Roman"],
"Kendi yaşam öyküsünü yazan kişinin eserine otobiyografi denir.")
]);

lesson(MAT,"1. Ünite","mat-carp","Çarpanlar ve Katlar","EBOB, EKOK, aralarında asal sayılar",
N("Bir sayıyı <b>asal çarpanlarına</b> ayırmak EBOB ve EKOK bulmanın temelidir. Örneğin 12 = 2² · 3 ve 18 = 2 · 3² olur.",[
"<b>EBOB:</b> Sayıların ortak bölenlerinin en büyüğü. Ortak asal çarpanların en küçük üslüleri çarpılır.",
"<b>EKOK:</b> Sayıların ortak katlarının en küçüğü. Tüm asal çarpanların en büyük üslüleri çarpılır.",
"<b>Aralarında asal:</b> EBOB’u 1 olan sayılardır."
],"12 ve 18 için EBOB = 2 · 3 = 6, EKOK = 2² · 3² = 36.","“Bölme, parçalara ayırma, en büyük” → EBOB. “Birlikte tekrar, aynı anda buluşma, en az” → EKOK."),
[
mc("Ali her 12 günde, Ayşe her 18 günde bir kütüphaneye gidiyor. İkisi bugün kütüphanede karşılaştığına göre bir sonraki karşılaşmaları kaç gün sonra olur?",
"36 gün",
["6 gün","24 gün","216 gün"],
"Aynı anda tekrar buluşma EKOK ile bulunur. EKOK(12, 18) = 36."),
mc("Boyutları 48 cm ve 72 cm olan dikdörtgen biçimli karton, artmayacak şekilde birbirine eş ve en büyük karelere ayrılacaktır. Karelerin bir kenarı kaç cm olur?",
"24 cm",
["6 cm","12 cm","36 cm"],
"Eş ve en büyük parçalara ayırmada EBOB kullanılır. 48 = 2⁴·3 ve 72 = 2³·3², EBOB = 2³·3 = 24."),
tf("12 ve 35 sayıları aralarında asaldır.",true,
"12 = 2²·3 ve 35 = 5·7 ortak asal çarpana sahip değildir; EBOB(12, 35) = 1.")
]);

lesson(MAT,"1. Ünite","mat-uslu","Üslü İfadeler","Üslü sayılar, işlemler, bilimsel gösterim",
N("<b>Üslü ifade:</b> aⁿ, a sayısının n kez çarpımıdır.",[
"aᵐ · aⁿ = aᵐ⁺ⁿ &nbsp; | &nbsp; aᵐ ÷ aⁿ = aᵐ⁻ⁿ &nbsp; | &nbsp; (aᵐ)ⁿ = aᵐ·ⁿ",
"a⁰ = 1 (a ≠ 0) &nbsp; | &nbsp; a⁻ⁿ = 1 / aⁿ",
"Negatif bir sayının çift kuvveti pozitif, tek kuvveti negatiftir.",
"<b>Bilimsel gösterim:</b> a · 10ⁿ biçimindedir ve 1 ≤ a &lt; 10 olmalıdır."
],"0,00045 = 4,5 · 10⁻⁴"),
[
mc("2³ · 2⁴ işleminin sonucu hangisidir?",
"2⁷",
["2¹²","4⁷","2¹"],
"Taban aynı olduğunda üsler toplanır: 3 + 4 = 7."),
mc("(−3)² + 3⁰ işleminin sonucu kaçtır?",
"10",
["8","9","11"],
"(−3)² = 9 ve 3⁰ = 1 olduğundan 9 + 1 = 10."),
mc("0,00045 sayısının bilimsel gösterimi hangisidir?",
"4,5 · 10⁻⁴",
["4,5 · 10⁻³","45 · 10⁻⁵","4,5 · 10⁴"],
"Virgül 4 basamak sağa kaydırılarak 4,5 elde edilir; bu yüzden üs −4’tür.")
]);

lesson(MAT,"2. Ünite","mat-kok","Kareköklü İfadeler","Karekök, a√b biçimi, işlemler, gerçek sayılar",
N("<b>Karekök:</b> √(a²) = a (a ≥ 0). Tam kare sayıların karekökü tam sayıdır.",[
"<b>a√b biçimi:</b> √18 = √(9·2) = 3√2",
"<b>Toplama-çıkarma:</b> Kök içleri aynı olan ifadeler toplanıp çıkarılır. 2√3 + 3√3 = 5√3",
"<b>Çarpma-bölme:</b> √a · √b = √(ab), √a ÷ √b = √(a/b)",
"<b>Ondalık ifadeler:</b> √0,25 = 0,5",
"<b>Gerçek sayılar:</b> Rasyonel ve irrasyonel sayıların birleşimidir. √2, π irrasyoneldir."
]),
[
mc("√50 ifadesi a√b biçiminde nasıl yazılır?",
"5√2",
["25√2","10√5","5√5"],
"√50 = √(25·2) = 5√2."),
mc("√12 + √27 işleminin sonucu kaçtır?",
"5√3",
["√39","5√6","6√3"],
"√12 = 2√3 ve √27 = 3√3 olduğundan toplam 5√3 olur."),
mc("Aşağıdakilerden hangisi irrasyonel bir sayıdır?",
"√7",
["√49","√0,25","3/4"],
"√49 = 7, √0,25 = 0,5 ve 3/4 rasyoneldir. √7 ise sonsuz ve devirsiz ondalık açılıma sahiptir.")
]);

lesson(MAT,"3. Ünite","mat-cebir","Cebirsel İfadeler ve Özdeşlikler","Tam kare, iki kare farkı, çarpanlara ayırma",
N("Özdeşlikler çarpma ve çarpanlara ayırmada kolaylık sağlar.",[

lesson(MAT,"4. Ünite","mat-dogrusal","Doğrusal Denklemler","Eğim, koordinat sistemi, doğru denklemi",
N("Birinci dereceden bir bilinmeyenli denklemler eşitliğin korunmasıyla çözülür.",[

lesson(MAT,"6. Ünite","mat-cisim","Geometrik Cisimler","Prizma, silindir, piramit, koni",

function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=r[i];r[i]=r[j];r[j]=t;}return r;}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return ymd(new Date());}
function yesterdayStr(){const d=new Date();d.setDate(d.getDate()-1);return ymd(d);}
function pdate(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(s,n){const d=pdate(s);d.setDate(d.getDate()+n);return ymd(d);}
function lastDays(n){const r=[];for(let i=n-1;i>=0;i--)r.push(addDays(todayStr(),-i));return r;}
const WD=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const MONTHS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function wdOf(s){return WD[pdate(s).getDay()];}
function weekStart(s){const d=pdate(s);return addDays(s,-((d.getDay()+6)%7));}
function dmy(s){const d=pdate(s);return d.getDate()+' '+MONTHS[d.getMonth()];}
function fmtMin(sec){const m=Math.round(sec/60);return m>=60?Math.floor(m/60)+' sa '+(m%60)+' dk':m+' dk';}
function starsHTML(n){let s='';for(let i=1;i<=3;i++)s+='<span class="'+(i<=n?'':'off')+'">⭐</span>';return s;}

function recordAnswer(q,ok,dt,quiet){
  if(!q||!q.id)return;
  const now=Date.now();
  const s=U.qs[q.id]||(U.qs[q.id]={a:0,c:0,w:0,t:0});
  s.a++;if(ok)s.c++;else s.w++;s.t=now;
  const d=dayRec(todayStr(),true);
  d.q++;if(ok)d.c++;else d.w++;d.sec+=Math.max(0,Math.min(dt||0,120));
  if(ok)U.stats.correct++;else U.stats.wrong++;
  if(!ok){
    const w=U.wrongs[q.id];
    if(w){w.n++;w.last=now;w.solved=false;w.u=now;}
    else U.wrongs[q.id]={first:now,last:now,n:1,solved:false,rt:0,rf:0,u:now};
  }else{
    const w=U.wrongs[q.id];
    if(w&&!w.solved&&!q.retry){
      w.rt++;w.solved=true;w.u=now;w.solvedAt=now;
      ensureQuest();U.quest.wsolved++;
    }
  }
}
function toggleSolved(id){
  const w=U.wrongs[id];if(!w)return;
  w.solved=!w.solved;w.u=Date.now();
  if(w.solved){w.solvedAt=w.u;ensureQuest();U.quest.wsolved++;}
  saveDB();checkAch();
}
function toggleMap(map,id){

}
function isOn(map,id){const c=U[map][id];return !!(c&&c.on);}

function nextLeague(xp){for(let i=0;i<LEAGUES.length;i++)if(LEAGUES[i].xp>xp)return LEAGUES[i];return null;}
function checkLeague(){

function mergeU(l,c){l=l||{};Object.keys(c||{}).forEach(k=>{if(!l[k]||((c[k]||{}).u||0)>((l[k]||{}).u||0))l[k]=c[k];});return l;}
function mergeNum(l,c){l=l||{};Object.keys(c||{}).forEach(k=>{l[k]=Math.max(l[k]||0,c[k]||0);});return l;}
function mergeArr(l,c,lim){
  const m={};(l||[]).concat(c||[]).forEach(x=>{m[x.ts]=x;});
  return Object.keys(m).map(k=>m[k]).sort((a,b)=>a.ts-b.ts).slice(-lim);
}
function mergeProgress(l,c){
  if((c.profileUpdated||0)>(l.profileUpdated||0)){
    if(c.name)l.name=c.name;l.nameSet=!!c.nameSet;if(c.avatar)l.avatar=c.avatar;
    l.title=c.title||'';l.frame=c.frame||'';l.profileUpdated=c.profileUpdated;
  }
  normalizeUser(l);
  l.xp=Math.max(l.xp||0,c.xp||0);
  if((c.last||'')>(l.last||'')){l.last=c.last;l.streak=c.streak||0;}
  else if((c.last||'')===(l.last||'')){l.streak=Math.max(l.streak||0,c.streak||0);}
  Object.keys(c.done||{}).forEach(k=>{l.done[k]=Math.max(l.done[k]||0,c.done[k]||0);});
  Object.keys(c.ach||{}).forEach(k=>{if(!l.ach[k]||c.ach[k]<l.ach[k])l.ach[k]=c.ach[k];});
  Object.keys(c.dragons||{}).forEach(k=>{if(!l.dragons[k]||c.dragons[k]<l.dragons[k])l.dragons[k]=c.dragons[k];});
  mergeNum(l.stats,c.stats);
  Object.keys(c.qs||{}).forEach(k=>{l.qs[k]=mergeNum(l.qs[k],c.qs[k]);});
  Object.keys(c.daily||{}).forEach(k=>{l.daily[k]=mergeNum(l.daily[k],c.daily[k]);});
  mergeU(l.wrongs,c.wrongs);mergeU(l.marks,c.marks);mergeU(l.coll,c.coll);mergeU(l.customQs,c.customQs);
  l.exams=mergeArr(l.exams,c.exams,30);l.sessions=mergeArr(l.sessions,c.sessions,200);
  const cp=c.plan||{};
  mergeU(l.plan.tasks,cp.tasks);
  if((cp.gu||0)>(l.plan.gu||0)){l.plan.goals=Object.assign(l.plan.goals,cp.goals||{});l.plan.gu=cp.gu;}
  Object.keys(c.bosses||{}).forEach(k=>{l.bosses[k]=mergeNum(l.bosses[k],c.bosses[k]);});
  if(c.created&&(!l.created||c.created<l.created))l.created=c.created;
  const cq=c.quest;
  if(cq&&cq.date){
    if(!l.quest||!l.quest.date||cq.date>l.quest.date){l.quest=Object.assign(defaults().quest,cq);}
    else if(cq.date===l.quest.date){
      ['lessons','correct','perfect','wsolved','fmin'].forEach(k=>{l.quest[k]=Math.max(l.quest[k]||0,cq[k]||0);});
      l.quest.claimed=Object.assign({},cq.claimed||{},l.quest.claimed||{});
    }
  }
  if(leagueIdx(c.league||'bronze')>leagueIdx(l.league||'bronze'))l.league=c.league;
}
async function pullCloud(){

    cloudReady=true;saveDB();
    await pushCloud();
    return true;
  }catch(e){
    toast('⚠️','Bulut','İlerleme buluttan alınamadı; bu cihazdaki ilerleme kullanılıyor.');
    return false;
  }
}

          if(idle)go(view,viewArg);

async function googleSignIn(){
  const btn=$('#gBtn'),label=btn.querySelector('span');
  if(location.protocol==='file:'){authError('Google girişi için siteyi https adresinden aç (dosyayı çift tıklayıp açınca çalışmaz).');return;}
  btn.disabled=true;label.textContent='Bağlanıyor…';
  let fb=null;
  try{
    fb=await loadFirebase();
    await fb.A.signInWithPopup(fb.auth,new fb.A.GoogleAuthProvider());
  }catch(err){
    const c=err&&err.code;
    if(fb&&(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment')){
      try{await fb.A.signInWithRedirect(fb.auth,new fb.A.GoogleAuthProvider());return;}catch(e2){}
    }
    if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request'){
      authError(c==='auth/unauthorized-domain'?'Bu site adresi Firebase’de yetkili alan adları arasında değil.':'Google girişi başarısız oldu. Tekrar dene.');
    }
    btn.disabled=false;label.textContent='Google ile giriş yap';
  }
}

function readImage(file,cb){
  if(!file||file.size>8*1024*1024){cb(null);return;}
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(img.width,img.height),c=document.createElement('canvas');
      c.width=c.height=128;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);
      cb(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>cb(null);
    img.src=fr.result;
  };
  fr.onerror=()=>cb(null);
  fr.readAsDataURL(file);
}

const C_GREEN='#58cc02',C_RED='#ff4b4b',C_BLUE='#1cb0f6',C_YEL='#ffc800',C_PUR='#ce82ff';
function sumDays(days){
  const r={q:0,c:0,w:0,sec:0,fs:0,xp:0};
  days.forEach(d=>{const x=dayRec(d);r.q+=x.q;r.c+=x.c;r.w+=x.w;r.sec+=x.sec;r.fs+=x.fs;r.xp+=x.xp;});
  return r;
}
function growBars(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('[data-h]').forEach(e=>{e.style.height=e.dataset.h;});
    root.querySelectorAll('[data-w]').forEach(e=>{e.style.width=e.dataset.w;});
  }));
}
function barChart(days,valFn,color,fmt){
  const vals=days.map(valFn),mx=Math.max.apply(null,vals.concat([1]));
  let h='<div class="chart">';
  days.forEach((d,i)=>{
    const v=vals[i];
    h+='<div class="col"><span class="val">'+(v?fmt(v):'')+'</span><div class="stack" data-h="'+Math.round(v/mx*100)+'px" style="background:'+color+'"></div><span class="lab">'+wdOf(d)+'</span></div>';
  });
  return h+'</div>';
}

function buildWeakSession(){
  const weak=weakTopics();
  if(!weak.length)return null;
  let pool=[];
  weak.slice(0,6).forEach(x=>{
    const qs=lessonQs(x.l),wr=qs.filter(q=>U.wrongs[q.id]&&!U.wrongs[q.id].solved),rest=qs.filter(q=>wr.indexOf(q)<0);
    pool=pool.concat(shuffle(wr).concat(shuffle(rest)).slice(0,4));
  });
  return shuffle(pool).slice(0,12);
}

function bankList(){
  return allQuestions().filter(q=>{
    if(bankF.subj!=='all'&&q.subjId!==bankF.subj)return false;
    if(bankF.topic!=='all'&&q.lid!==bankF.topic)return false;
    if(bankF.diff!=='all'&&(q.diff||'medium')!==bankF.diff)return false;
    const st=bankF.status;
    if(st==='unsolved'&&U.qs[q.id])return false;
    if(st==='wrong'&&!U.wrongs[q.id])return false;
    if(st==='marked'&&!isOn('marks',q.id))return false;
    if(st==='coll'&&!isOn('coll',q.id))return false;
    if(st==='custom'&&!q.custom)return false;
    return true;
  });
}

const EXAM_SPECS={
  full:{name:'Tam Deneme',n:{tr:20,mat:20,fen:20,ink:10,din:10,ing:10},dur:75*60,icon:'🎓',desc:'90 soru · 75 dakika'},
  mini:{name:'Mini Deneme',n:{tr:7,mat:7,fen:7,ink:3,din:3,ing:3},dur:25*60,icon:'⚡',desc:'30 soru · 25 dakika'}
};
function toExamQ(q){
  const base={id:q.id,subjId:q.subjId,topic:q.topic,explain:q.explain};
  if(q.type==='tf')return Object.assign(base,{title:'Aşağıdaki ifade doğru mudur?\n\n“'+q.statement+'”',opts:['Doğru','Yanlış'],ans:q.answer?0:1});
  if(q.type==='fill'){const o=shuffle(q.options);return Object.assign(base,{title:q.title+'\n\n'+q.before+' ______ '+q.after,opts:o,ans:o.indexOf(q.answer)});}
  const o=shuffle(q.options.map(x=>({t:plain(x.t),ok:x.ok})));
  return Object.assign(base,{title:q.title,opts:o.map(x=>x.t),ans:o.findIndex(x=>x.ok)});
}
function buildExam(type){
  const spec=EXAM_SPECS[type],qs=[];
  CORE.forEach(s=>{
    shuffle(QALL.filter(q=>q.subjId===s.id&&q.type!=='blocks')).slice(0,spec.n[s.id]).forEach(q=>qs.push(toExamQ(q)));
  });
  return {type,qs,ans:qs.map(()=>-1),marks:qs.map(()=>false),i:0,start:Date.now(),dur:spec.dur};
}

function finishExam(auto){
  const E=U.examState;if(!E)return;
  if(examTick){clearInterval(examTick);examTick=null;}
  const subs={};CORE.forEach(s=>{subs[s.id]={d:0,y:0,b:0,t:0};});
  const rev=[];
  E.qs.forEach((q,i)=>{
    const r=subs[q.subjId],a=E.ans[i];r.t++;
    if(a<0)r.b++;
    else if(a===q.ans){r.d++;recordAnswer({id:q.id},true,0);}
    else{r.y++;recordAnswer({id:q.id},false,0);}
    rev.push({t:q.title,o:q.opts,c:q.ans,a:a,e:q.explain,s:q.subjId,tp:q.topic});
  });
  const D=CORE.reduce((x,s)=>x+subs[s.id].d,0),Y=CORE.reduce((x,s)=>x+subs[s.id].y,0),B=CORE.reduce((x,s)=>x+subs[s.id].b,0);
  const net=D-Y/3,elapsed=Math.min(E.dur,Math.floor((Date.now()-E.start)/1000));
  Object.keys(subs).forEach(k=>{subs[k].n=subs[k].d-subs[k].y/3;});
  const ts=Date.now();
  U.exams.push({ts,type:E.type,dur:elapsed,subs,net,d:D,y:Y,b:B});
  if(U.exams.length>30)U.exams=U.exams.slice(-30);
  U.examRev=U.examRev||{};U.examRev[ts]=rev;
  Object.keys(U.examRev).sort().slice(0,-3).forEach(k=>{delete U.examRev[k];});
  dayRec(todayStr(),true).sec+=elapsed;
  U.stats.exams=(U.stats.exams||0)+1;
  bumpStreak();
  addXp(D*3+20);
  U.examState=null;
  checkAch();saveDB();
  go('examResult',ts);
  if(auto)toast('⏰','Süre doldu','Sınav otomatik olarak bitirildi.');
}

/* ================= FOCUS MODE ================= */
const FMODES={pomo:{name:'Pomodoro 25+5',f:25,b:5},long:{name:'50+10',f:50,b:10},free:{name:'Serbest',f:0,b:0}};
let FT={mode:'pomo',phase:'idle',running:false,endTs:0,startTs:0,remain:0,planned:0,accum:0,cycles:0,breaks:0,subj:'',timer:null};
let audioCtx=null;
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.3].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+0.2);});
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
}
function ftRemainMs(){return FT.running?Math.max(0,FT.endTs-Date.now()):FT.remain;}
function ftElapsedSec(){
  if(FT.mode==='free')return Math.floor((FT.accum+(FT.running?Date.now()-FT.startTs:0))/1000);
  return Math.max(0,FT.planned-Math.ceil(ftRemainMs()/1000));
}
function stopFocusTimer(){clearInterval(FT.timer);FT.timer=null;FT.phase='idle';FT.running=false;updatePill();}
function recordFocus(sec){
  if(sec<60)return;
  U.sessions.push({ts:Date.now(),mode:FT.mode,sec,subj:FT.subj});
  if(U.sessions.length>200)U.sessions=U.sessions.slice(-200);
  dayRec(todayStr(),true).fs+=sec;
  U.stats.focusSec=(U.stats.focusSec||0)+sec;
  ensureQuest();U.quest.fmin+=Math.floor(sec/60);
  addXp(Math.floor(sec/300));
  bumpStreak();
  checkAch();saveDB();
}
function ftStart(){
  const m=FMODES[FT.mode];
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  FT.phase='focus';FT.running=true;
  if(FT.mode==='free'){FT.startTs=Date.now();FT.accum=0;FT.planned=0;}
  else{FT.planned=m.f*60;FT.endTs=Date.now()+m.f*60000;FT.remain=m.f*60000;}
  clearInterval(FT.timer);FT.timer=setInterval(ftTick,250);ftTick();
}
function ftPause(){
  if(!FT.running)return;
  if(FT.mode==='free')FT.accum+=Date.now()-FT.startTs;else FT.remain=Math.max(0,FT.endTs-Date.now());
  FT.running=false;ftTick();
}
function ftResume(){
  if(FT.running||FT.phase==='idle')return;
  if(FT.mode==='free')FT.startTs=Date.now();else FT.endTs=Date.now()+FT.remain;
  FT.running=true;ftTick();
}
function ftStop(){
  if(FT.phase==='focus'){const sec=ftElapsedSec();recordFocus(sec);if(sec>=60)toast('⏱️','Seans kaydedildi',Math.floor(sec/60)+' dk odaklandın.');}
  stopFocusTimer();if(view==='focus')go('focus');
}
function ftTick(){
  if(FT.phase!=='idle'&&FT.mode!=='free'&&FT.running&&Date.now()>=FT.endTs){
    if(FT.phase==='focus'){
      recordFocus(FT.planned);FT.cycles++;beep();
      const m=FMODES[FT.mode];
      celebrate('⏱️','Odak tamamlandı!',m.f+' dakika odaklandın','Mola zamanı: '+m.b+' dakika dinlen. Mola sayacı başladı.');
      FT.phase='break';FT.planned=m.b*60;FT.endTs=Date.now()+m.b*60000;FT.remain=m.b*60000;FT.running=true;
    }else{
      FT.breaks++;beep();toast('☕','Mola bitti','Yeni bir odak seansına hazır mısın?');stopFocusTimer();
    }
    if(view==='focus'){go('focus');return;}
  }
  updatePill();
  if(view==='focus')updateFocusUI();
}
function updatePill(){
  if(FT.phase==='idle'||view==='focus'||view==='quiz'||view==='examRun'||view==='auth'||!U){fpill.classList.add('hidden');return;}
  fpill.classList.remove('hidden');fpill.classList.toggle('brk',FT.phase==='break');
  const s=FT.mode==='free'?ftElapsedSec():Math.ceil(ftRemainMs()/1000);
  fpill.textContent=(FT.phase==='break'?'☕ ':'⏱️ ')+fmtClock(s)+(FT.running?'':' ⏸');
}
function updateFocusUI(){
  const t=$('#ftTime'),r=$('#ftRing'),l=$('#ftLbl');if(!t)return;
  const C=691.15;
  let secs,frac;
  if(FT.mode==='free'){secs=ftElapsedSec();frac=(secs%3600)/3600;}
  else if(FT.phase==='idle'){secs=FMODES[FT.mode].f*60;frac=0;}
  else{secs=Math.ceil(ftRemainMs()/1000);frac=FT.planned?1-secs/FT.planned:0;}
  t.textContent=fmtClock(secs);r.style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,frac)));
  l.textContent=FT.phase==='idle'?'Hazır':FT.phase==='break'?'Mola ☕':(FT.running?'Odaklan 🔥':'Duraklatıldı ⏸');
}

  const w=el('section','page');

  Object.keys(FMODES).forEach(k=>{
    const b=el('button',FT.mode===k?'on':'',FMODES[k].name);

  const row=el('div','btn-row');

    const b=el('button','btn orange',FT.running?'⏸ Duraklat':'▶ Devam');b.addEventListener('click',()=>{if(FT.running)ftPause();else ftResume();go('focus');});
